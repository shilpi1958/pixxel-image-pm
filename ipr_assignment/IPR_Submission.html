<script type="application/json" id="data">{"docs": {"overview": {"title": "IPR PM Assignment – Submission", "label": "Overview", "num": "0", "md": "## Deliverables\n\n| # | Deliverable | Where |\n| --- | --- | --- |\n| 1 | 2-page note: what is happening in the pipeline, plus answers to questions A–F | [IPR Pipeline Health – 2-Page Note](#note) |\n| 2 | Top 5 daily metrics, with numerator and denominator | [2-page note, \"Top 5 daily metrics\"](#note); live on the dashboard |\n| 3 | Dashboard: views for the IPR lead, QA/QC, Engineering and Customer Success, filtered by week, satellite, bandset, priority and customer | [IPR Pipeline Dashboard](IPR_Pipeline_Dashboard.html) |\n| 4 | 2-week plan for 2 engineers and 1 QA/QC person | [IPR 2-Week Plan](#plan) |\n| 5a | Internal update to Engineering, IPR and QA/QC | [IPR Internal Update](#internal) |\n| 5b | Customer-safe update to Customer Success for a delayed high-priority image (UrbanAtlas P0s) | [IPR Customer-Safe Update](#customer) |\n\n**Supporting material:**\n\n- [IPR Data Cleaning Rules](#rules): every cleaning decision, with counts.\n- **IPR\\_Cleaned\\_Data.xlsx** (attached): the cleaned data, one row per image attempt. It includes a column guide and a log of every changed cell.\n\n## In short\n\n- **58% of processable images were on time** (52 of 89), and **no P0 met its 8h SLA** (0 of 8).\n- **28 images are late,** most by more than two weeks. 5 only need a release (2 more passed QC but have a stuck run); 8 are held for a bright-banding (BBR) defect.\n- **Every priority takes about the same time** (median 9–12h), so urgent orders get no faster path.\n- **QC may not gate delivery:** 74% of attempts were released before QC started (still to confirm with IPR / QA), and QC review can't be timed.\n\n## Key assumptions\n\n- **One row per image:** the latest valid attempt. 136 export rows → 95 images, 89 of them processable.\n- **Delivered** = passed QC and released. Released without a QC pass doesn't count.\n- **SLA** runs from acquisition, locked to the attempt-1 priority.\n- **\"Now\"** = 30 Jun 2026 16:06 UTC, the latest timestamp in the export (it has no pull time).\n- **Step targets** (share of the SLA window) are my proposal, still to be agreed with Engineering and QA."}, "note": {"title": "IPR Pipeline Health – 2-Page Note", "label": "2-page note", "num": "1 · 2", "md": "## Summary\n\nImages are late far more often than they fail, and P0 is worst: no P0 image met its SLA.\n\n| Headline | Value |\n| --- | --- |\n| On time (processable images) | 58% (52 of 89) |\n| Delivered at all | 69% (61 of 89) |\n| P0 on time | 0 of 8; 3 never arrived |\n| Customer status wrong | 45 of 95 images |\n\nFour causes:\n\n- **No priority lane:** processing and QC wait take the same time at every priority, so P0s queue behind P4s.\n- **QC may not gate release:** most uploads are logged before QC starts. Not yet confirmed: it could be late logging rather than a skipped check.\n- **Incomplete imagery enters processing:** incomplete images fail QC far more often than complete ones (an association, not proven cause).\n- **The data can't measure QC:** there is no QC-end timestamp.\n\n**Next:** the fix for each cause is sequenced in the [IPR 2-Week Plan](#plan).\n\n## Pipeline health\n\nEvery processable image that wasn't delivered is past its deadline. \\\n10 of them need no rework, only an upload or a QC decision.\n\n| Bucket | Images | Rule |\n| --- | --- | --- |\n| Not captured | 6 | Never imaged; out of KPIs |\n| Cloudy, not processable | 0 | Over 70% cloud |\n| Delivered | 61 | QC pass + upload |\n| QC passed, not uploaded | 7 | 5 ready to release; 2 have a stuck run to check first |\n| Uploaded without QC pass | 3 | On DataHub, not counted; 2 shown to customers as Delivered while QC is pending |\n| In progress | 7 | Processing or in QC |\n| Failed | 11 | Processing or QC failed |\n\n- **Cloud isn't the problem:** images up to 68% cloud were delivered.\n- **Long-late images:** median 17.9 days old; each needs a ship, re-task or close decision.\n\n## Where time is lost\n\nAverages look fine only because 48h orders dominate. By tier, processing alone breaks the 8h, 12h and 16h targets.\n\n_[Chart: processing time by priority, over all 123 valid attempts. Interactive in the live doc.]_\n\nFour steps, timestamp to timestamp. **Targets are my proposed split of each SLA, not agreed operational targets.**\n\n| Step | Proposed target (% of SLA) | Avg actual (h) | Avg proposed target (h) | Attempts over target |\n| --- | --- | --- | --- | --- |\n| 1. Acquisition → processing start | 20% | 9.1 | 6.1 | 51% |\n| 2. Processing | 30% | 5.2 | 9.2 | 31% |\n| 3. Waiting for QC | 10% | 3.5 | 3.1 | 59% |\n| 4. QC review (QC start → release) | 25% | −1.4 | 8.0 | Negative in 74% of attempts |\n| 5. Release | 15% |  |  |  |\n| End-to-end delivery time (per delivered image) | 85% | 13.1 | 26.3 | 21% |\n\nFew attempts meet the three measurable targets (ingest, processing, QC wait), and P0 almost never does. These cover three of the five stages, not the full SLA.\n\n| Measure | Value |\n| --- | --- |\n| Attempts meeting all three targets | 20% (25 of 123) |\n| …at P0, P1 or P2 | 0 |\n| P0 meeting the ingest target | 9% |\n| P0 meeting the QC-wait target | 18% |\n\nA missing timestamp counts as not met. P4 looks fine only because its 48h window is generous.\n\n**So:** the pipeline treats a P0 like a P4: QC wait is about 3.5h at every priority, first come, first served. And the timestamps can't say how long QC takes: step 4 is negative in 74% of attempts, meaning the upload was logged before QC started.\n\n## Root causes\n\n1. **Priority isn't in the workflow.** Processing and QC run first come, first served; nothing moves a P0 ahead. P0 median delivery is 10.4h against an 8h SLA.\n2. **QC sequencing is unclear.** Upload precedes QC start in 74% of attempts, and some images sit on DataHub without a pass. Either QC start is logged late or QA audits after release; IPR / QA must confirm which.\n3. **Incomplete imagery is processed anyway.** Almost every incomplete attempt ran, and incomplete images fail QC far more often (table below). No gate holds them for re-downlink or re-task.\n4. **BBR recurs.** It is the top failure reason, concentrated in Vegetation, and comes back on retry, so reprocessing alone doesn't fix it (patterns table).\n\n| Incomplete vs complete | Incomplete | Complete |\n| --- | --- | --- |\n| Attempts processed | 20 of 23 | all |\n| Images failing QC | 7 of 14 (50%) | 3 of 75 (4%) |\n\n### Patterns behind them\n\nFF02 and the Vegetation bandset stand out. Cloud and off-nadir angle don't.\n\n| Dimension | Data (89 processable images) | Read |\n| --- | --- | --- |\n| Satellite | FF02 36% on time vs 65–70%; carries 4 of 8 P0s. FF03 ingest is fastest (6.7h vs \\~10h) | Check FF02 downlink slots; partly priority mix |\n| Bandset | Vegetation 45% on time; 7 of 11 failures (5 BBR) | Start the BBR investigation here |\n| Relative light | Low 41%, Very Low 33% on time; Low has 5 failures and 47% reprocessed | Watch; small sample |\n| Cloud | Clear and Partial both 58% on time; Partial reprocessed more (39% vs 22%) | Not driving misses |\n| Off-nadir angle | 52–64% on time in every band; BBR at every angle | No pattern |\n| Failure reason | 13 BBR, 6 processing errors (3 ISOFIT, 3 water mask), 2 missing-metadata input errors; 40 caveats (19 low SNR, 16 minor haze, 5 artifact reduced) | BBR is the defect to fix; it repeats on retry (3 images had it on every attempt) |\n\nProcessing time barely varies with any of these (4.5–5.7h; correlation with angles, cloud and coverage ≤ 0.11). They cost time through failures and reprocessing, not slower runs.\n\n## Immediate actions: 5 cases, 6 images\n\nRanked by priority, hours late and ease of fix. Two need only a release.\n\n| # | Image | Customer | Priority | State | Overdue | Action (owner) |\n| --- | --- | --- | --- | --- | --- | --- |\n| 1 | FF01\\_20260601\\_1084\\_DUBAI | UrbanAtlas | P0 | Passed QC, never uploaded | 697h | Release today (Eng). Customer has asked for an update |\n| 2 | FF01\\_20260614\\_1040\\_GUJAR | MineralsCo | P0 | Passed QC, never uploaded | 375h | Upload today (Eng) |\n| 3 | FF02\\_20260605\\_1088\\_DUBAI | UrbanAtlas | P0 | QC pending | 592h | QC decision first in the queue (QA/QC). Second late P0 for UrbanAtlas, so one CS update covers both |\n| 4 | FF02\\_20260613\\_1042\\_RAJAS | AgriSense | P1 | Passed QC, but processing never recorded an end | 401h | Confirm the output exists, then release (Eng) |\n| 5 | FF01\\_20260623\\_1026\\_NILED, FF03\\_20260624\\_1086\\_DUBAI | AgriSense, UrbanAtlas | P1 | Never captured, but customers are told \"Delivered\" | n/a | Correct the customer status and offer a re-task (CS) |\n\nAfter these, 3 more QC-passed images can be released today, and one more (P3, FF01\\_20260611\\_1089\\_GUJAR) has a stuck run to check first. The 3 uploaded without a QC pass need a QC decision; 2 of them show Delivered to customers.\n\n## Measure it: top 5 daily metrics\n\nHeadline: on-time delivery, 58% (P0 0%). Values cover the June export.\n\n| # | Metric | Numerator | Denominator | Current |\n| --- | --- | --- | --- | --- |\n| 1 | On-time delivery % | Processable images delivered (QC pass + upload) by their deadline | Processable images whose deadline has passed | 58% (52/89); P0 0/8 |\n| 2 | Late images | Processable images not delivered and past their deadline | A count, split by state | 28: 7 QC passed but not uploaded, 3 uploaded without QC, 7 in progress, 11 failed |\n| 3 | Delivery time: median / slowest 10%, by priority | Hours from acquisition to first delivery | Delivered images in that priority | 10.9h / 17.8h; P0 median 10.4h against an 8h SLA |\n| 4 | First-pass QC pass % | Images that pass manual QC on attempt 1 | Attempt-1 images with a QC decision (pass, fail, or reprocess required) | 83% (65/78) |\n| 5 | Reprocess success % | Reprocessed images that end up delivered | Processable images with 2 or more attempts | 85% (22/26) |\n\nThe choice of denominator barely moves the headline:\n\n| Denominator | On time |\n| --- | --- |\n| All 95 images | 55% |\n| 89 processable (used here) | 58% |\n| Excluding images ≥ 60% cloud | 61% |\n\n## Data fixes, in four themes\n\nThe metrics above are only as good as these fixes. QC can't be timed until the first row lands.\n\n| Theme | Gaps today | Fix |\n| --- | --- | --- |\n| Observability | No QC-end time; no per-step processing times (L1C / ISOFIT / L2A); no order or export timestamp | Log QC start and end, each processing step and order time; stamp each export |\n| Workflow integrity | Upload before QC start (74% of attempts); stale status text (41 of 123); 3 reruns after delivery with no reason | Reject out-of-order timestamps; fixed status lists; require a rerun reason |\n| Data integrity | 6 duplicate rows; priority changed on retry (21 images); mixed labels; 8 QC Results left Pending after a verdict | Unique key Image ID + attempt; lock priority after attempt 1; record result and reason together |\n| Customer visibility | Customer status wrong for 45 of 95; no escalation log (25 of 34 blocked images show none) | Derive status from pipeline state; log Escalated At, Escalated To and ticket ID |\n\nAll 15 gaps, the cleaning decisions and the checks to enforce at the source: [Appendix](#appendix).\n\n## Assumptions and open questions\n\n**How the numbers are counted**\n\n- One row per image and attempt; the latest valid attempt is the image's row.\n- Priority and SLA locked to attempt 1 (21 images changed priority on a retry).\n- Delivered = QC pass + upload. A pass with a caveat counts, shown apart.\n- The 6 never-captured images are left out of processable-image KPIs.\n- The SLA is assumed to start at acquisition; the export has no order time.\n\n**For IPR / QA**\n\n- **Why are 74% of attempts uploaded before QC starts?** DataHub as QC staging is ruled out (no QC fail was ever uploaded). Either QC start is logged late, or a QA audit runs after release.\n- **Does the SLA start at acquisition or at order?** If it's order time, every on-time number here is optimistic.\n- **Is moderate BBR a fail?** I mapped Severe and Moderate BBR to Fail. If moderate banding is sometimes acceptable, that row becomes Pass with a caveat.\n- **How long does a manual QC review take, and where is QC recorded?** A rough estimate per bandset helps; whether that system can take QC End decides if week 2's logging is a setting or a build.\n- **Do the proposed step targets fit?** Ingest 20, processing 30, QC wait 10, QC review 25 and release 15% of SLA.\n- **Why are images reprocessed?** 23 of 34 reprocesses followed a QC pass, and 3 delivered images were reworked. No reason is recorded.\n\n## Index: the brief's questions\n\n|  | Question | Short answer | Where |\n| --- | --- | --- | --- |\n| A | Processing health | 95 images: 89 processable, 6 not captured. Of the 89: 61 delivered, 7 in progress, 11 failed, 7 passed QC but not uploaded, 3 uploaded without a QC pass | Pipeline health |\n| B | Images needing attention | 5 cases, 6 images: two P0s that only need a release, a P0 waiting for QC, a stuck P1 that passed QC, and two never-captured images shown as Delivered | Immediate actions |\n| C | Patterns | FF02 (36% on time) and Vegetation (7 of 11 failures, 5 BBR) stand out; incomplete images fail far more; cloud and off-nadir angle show no pattern | Root causes |\n| D | Duplicates and attempts | One row per Image ID + attempt (6 stale duplicates removed); the latest valid attempt is the image's row; SLA locked to attempt 1 | Assumptions; Appendix |\n| E | What counts as delivered | QC Result Pass and uploaded; a pass with a caveat counts, shown apart. SLA assumed to run from acquisition | Assumptions; Top 5, metric 1 |\n| F | Data gaps to fix first | No QC-end time, upload before QC (74%), wrong customer status (45 of 95), no escalation log; 15 in all | Data fixes; Appendix |"}, "appendix": {"title": "Appendix: method and data detail", "label": "Note appendix", "num": "1", "md": "Not part of the two pages. The cleaning decisions, label mappings, full list of data gaps and the checks to enforce at the source, kept here as the audit trail behind the note.\n\n## How I cleaned the data\n\nEvery number depends on these decisions. Source: IPR\\_Cleaned\\_Data.xlsx. Terms are in the Glossary of the rules doc.\n\n| Decision | What I did | Why |\n| --- | --- | --- |\n| One row per image | 136 rows → 95 images (latest valid attempt); 6 stale duplicates removed. One Row Status column marks each row (Latest attempt / Not captured / Earlier attempt / Removed), replacing two Yes/No flags | No double counting |\n| Priority and SLA | Locked to attempt 1: P0 8h, P1 12h, P2 16h, P3 24h, P4 48h | 21 images changed priority on a retry |\n| Delivered | QC pass + upload (Delivery Status) | 3 images uploaded without a QC pass don't count |\n| Processable | 89 of 95; the 6 never captured are excluded | Partly cloudy images were still delivered (up to 68% cloud) |\n| Conflicts | One column, 20 types; None = clean | 81 of 95 images have at least one |\n| Stage times | All 123 valid attempts; 4 duration columns | Every run costs time |\n| Snapshot | 2026-06-30 16:05 UTC, the latest timestamp | Ages undelivered images |\n| Labels and timestamps | Standardized; originals in Fixes\\_Log | Audit trail |\n| Late | Past the SLA deadline (delivered late or still open); one rule across every view | \"Not delivered\" would count images not yet due |\n| Passed with caveat (Low SNR / Minor haze / Artifact reduced) | Counts as delivered, shown apart: 24 of 61 delivered, 21 of 52 on time | Ambiguous success label; a known issue isn't a clean pass |\n| Customer status | Shown vs derived, ranked by risk: 4 shown Delivered when not, 2 delays hidden | 45 of 95 differ; CS must fix the worst first |\n| Internal customers | Calibration and Internal Demo stay in pipeline metrics; left out of customer views | Same pipeline load, but no customer to update; on-time barely moves (58% → 59%) |\n| Processing Status → Last Pipeline Status (raw) | Renamed, kept raw and treated as unreliable: not used for any metric or gate | Not a processing status: every stage writes its last event here (QC 15, delivery 40 attempts). Lags the timestamps in 41 of 123 attempts |\n| Failure Reason | Kept raw; 15 spellings grouped into QC Finding (BBR, Processing error: ISOFIT crash, Processing error: Water mask, Input error: Missing metadata, No data, Caveat: Low SNR, Caveat: Minor haze, Caveat: Artifact reduced, None) | Free text with five spellings of BBR; every Fail has a reason, so it's usable once grouped |\n| Offset North / East (km) | Read as target offset from plan, per Column\\_Map | Not off-nadir ground displacement; view tilt is Off Nadir (°) |\n\n### Text changes\n\nOne value per meaning; originals in Fixes\\_Log.\n\n| Column | Raw variants | Cleaned values | Rows changed |\n| --- | --- | --- | --- |\n| Cloud Status | CLEAR, clear, Partial cloud, partly cloudy, Partly Cloudy, CLOUDY | Clear (<30%), Partial (30–70%), Cloudy (>70%), Unknown | 119 |\n| Bandset | VNIR\\_FULL, Standard\\_RGB, vegetation, VEG, RedEdge | VNIR Full, RGB, Vegetation, Red Edge, Water/Coastal | 110 |\n| Priority | Urgent, P0, P1, High, high, P2, Standard, blank | P0 (8h), P1 (12h), P2 (16h), P3 (24h), P4 (48h) | 108 |\n| QC Result | pass, Pass, QC Pass, Manual pass with note, QC Fail, FAIL\\_artifact, Severe / Moderate BBR, NA | Pass, Fail, Pending, Reprocess required, Not applicable | 86 |\n| Image Complete | OK, complete, Partial, Strip incomplete | Complete, Incomplete, No image | 86 |\n| Reprocessed | no, False, blank | Column dropped: Attempt > 1 says the same | 74 |\n| Target Status | Missed, NOT\\_CAPTURED | Captured, Partial, Not captured | 9 |\n| Relative Light | 0.48, 0.72 (numbers in a text field) | Flagged as Unmapped numeric | 6 |\n| Strip Fulfillment | fulfilled | Fulfilled | 4 |\n\nWatch the priority names: raw High (16h) → P2, raw P2 (24h) → P3.\n\n### QC vs QA, and why the columns say QC\n\n- **QC** = review of each image. **QA** = process quality, shown as metrics.\n- The data only records QC, so the columns say QC: QA Assigned → QC Start, Manual QC Status → QC Result.\n- \"QA/QC\" stays as the team name, as in the brief.\n\nOn-time % = delivered by the deadline ÷ processable images past their deadline (all 89). In the workbook: Delivered and Hours vs Deadline ≤ 0.\n\n## All 15 data gaps\n\n81 of 95 images have a conflict. Biggest gap: no QC-end time, so review can't be timed. The main note groups these into four themes.\n\n| # | Gap | Impact | Fix |\n| --- | --- | --- | --- |\n| 1 | No QC-end time | QC review can't be timed | Log QC start and end |\n| 2 | QC starts after upload (74% of attempts) | QC may not gate delivery | Confirm with IPR / QA |\n| 3 | Customer status wrong for 45 of 95 images | Customers misinformed | Derive it from pipeline state |\n| 4 | Missing values (13 uploads, 8 strip times, 6 QC starts, 4 processing ends, 3 cloud %) | Rows drop out of timing | Required at each handoff |\n| 5 | 6 stale duplicate rows | Double counting | Unique key: Image ID + attempt |\n| 6 | Priority changed on retry (21 images) | SLA can look met after a downgrade | Lock priority to attempt 1; the workbook keeps the raw per-attempt deadline as Attempt Deadline (raw) (differs on 24 retry rows) |\n| 7 | Mixed formats, messy labels, stale status text (41 of 123 attempts) | Wrong dates and stages | One UTC format, fixed status lists |\n| 8 | No export timestamp | Ages rest on an assumed snapshot | Stamp each export |\n| 9 | No order-created time | SLA only measurable from acquisition | Log order time |\n| 10 | No per-step processing times; queue names don't show the step | Can't tell which step makes P0 miss 2.4h | Log L1C / ISOFIT / L2A start and end |\n| 11 | No escalation log; 25 of 34 blocked images show no sign of escalation (all 3 stuck runs) | Can't tell if blocked images reached the right team | Log Escalated At, Escalated To and ticket ID |\n| 12 | QC Result not updated: 8 rows still Pending though Failure Reason already holds a verdict (5 read as a pass, 3 as a fail) | Images wait for a decision QC may already have made | Record the result and the reason in one step, where QC records its result |\n| 13 | Rerun after delivery with no reason: 3 images delivered on attempt 1, then re-run (2 with priority raised); the customer now sees At risk | Can't tell a customer request from a QC recheck; Delivered hides open rework | Require a rerun reason when an attempt starts on a delivered image |\n| 14 | No SNR or haze % logged; both exist only as QC notes (Low SNR 15 images, Minor haze 12) | Can't set thresholds or trend sensor quality; a caveat can't be checked | Log SNR per band and haze % per image |\n| 15 | Notes have no author; by wording they come from IPR, QA/QC, CS and ground | A note can't be routed or trusted; no one owns follow-up | Log the note's author and team |\n\n### Checks to enforce at the source\n\nThe sheet only flags problems. These checks stop them at the source. (Blocking \"uploaded before QC\" in the sheet would hide a signal the team still has to explain.)\n\n| Check | Where it runs | Action |\n| --- | --- | --- |\n| Timestamps in order: acquisition ≤ trigger ≤ processing end ≤ QC start | Pipeline write | Reject and alert |\n| Upload only after QC Result = Pass | DataHub upload step | Block, once the team confirms QC gates delivery |\n| One row per Image ID + attempt | Export / database key | Reject the duplicate |\n| Priority and SLA locked after attempt 1 | Order system | Changes need an override with a reason |\n| Status values from a fixed list | Every status field | Reject free text |\n| Cloud % between 0 and 100, angles in range | Ingest | Reject and flag |\n| Customer status derived from pipeline state | CS tool | Never set by hand |\n| Target Status derived from Plan Coverage %: ≥ 95% = Captured, 1–94% = Partial, 0% = Not captured | Acquisition / ingest | Set automatically, never by hand. Removes \"Not captured\" images that show 12.4% coverage |\n| Image Complete limited to data integrity: \"All frames received: Yes / No\" | Ingest | Says nothing about coverage, so it can't contradict Target Status (8 rows say Complete at 42–79% coverage today) |\n| Completeness gate before processing: all frames received, or the AOI's frames are | Ingest, before Trigger | Complete → process. AOI frames present → process, flagged. AOI frames missing → hold, re-downlink or re-task; never rerun. Today 20 of 23 incomplete attempts were processed, and 7 of 14 incomplete images failed QC (vs 3 of 75 complete) |\n| QC Result is the decision only (Pass, Fail, Pending, Reprocess required); the defect goes in QC Finding with a severity (e.g. BBR: severe / moderate) | Where QC records its result (the system behind Manual QC Status) | Required on every Fail and every pass with a caveat. Today severity sits in free text; the workbook rebuilds it as BBR Severity |\n\nThe full set is 20 column-pair rules, each with how often this export breaks it and whether to block, warn or review: see \"Contradiction checks\" in the [IPR Data Cleaning Rules](#rules).\n\n## Further open questions\n\n- **Who sets Strip Fulfillment, and when?** It comes after upload in 44 of 53 rows, and 5 never-captured images are marked Fulfilled. Left out of all metrics.\n- **Moderate vs severe BBR:** one row says moderate in its QC status but severe in Failure Reason; I recorded it as Severe. BBR Severity in the workbook keeps which."}, "plan": {"title": "IPR 2-Week Plan", "label": "2-week plan", "num": "4", "md": "## Goals\n\n- **Recover priority images:** release the late P0/P1 images first.\n- **Recover throughput:** release as many other late images as possible.\n- **Prevent recurrence:** move P0/P1 ahead in processing and QC, and block releases that haven't passed QC.\n- **Make delays visible:** log when QC starts and ends, when each image is released, and every escalation.\n- **Clean the tracker:** fix the records that are wrong today, and automate every field that can be automated.\n\n## Targets\n\n| Measure | Now | End of week 1 | End of week 2 |\n| --- | --- | --- | --- |\n| Late images | 28 | about 14 | 12 or fewer, each with an owner and ETA |\n| Late P0/P1 images | 7 | 1 | 1 (a P1 BBR hold) |\n| P0/P1 processing lane | none | built | live from Day 7; measured once new orders resume |\n| Images released without a QC pass | 3 | logged, not blocked | 0 new from Day 9, except signed P0 overrides |\n| Attempts uploaded before QC started | 74% |  | 0% from Day 9 |\n| New attempts with QC Start, QC End and release time | 0% |  | 100% from Day 7 |\n| Delivered images that passed QC with a caveat (Low SNR, haze, artifact), re-reviewed | 0 of 24 | all 24 |  |\n| Images showing customers the wrong status | 45 of 95 | 0 |  |\n\nWhat stays late at the end of week 2:\n\n| Group | Images |\n| --- | --: |\n| BBR holds, waiting for the week 3 fix | 8 |\n| Incomplete image, waiting for re-downlink or re-task | 1 |\n| QC fails or retries that don't recover (estimate) | up to 3 |\n| **Total** | **12 or fewer** |\n\n## Team\n\n| Who | Owns | Hours |\n| --- | --- | --: |\n| Engineer A | Processing: stuck runs, retries, P0/P1 lane, BBR investigation | 60h |\n| Engineer B | Release and data: releases, QC gate, logging, alerts | 60h |\n| QA/QC | QC decisions, release sign-off, caveat recheck, BBR review, QC criteria | 60h |\n| IPR Lead | Priorities, escalations, customer updates |  |\n\nAssumes no new images arrive and 6 productive hours a day. Engineer owners are confirmed on Day 1.\n\n## Release order for the 28 late images\n\n| Order | Images | Next step | Owner |\n| --: | --- | --- | --- |\n| 1 | 6 of the 7 late P0/P1 (the 7th is a BBR hold, row 6) | Release 2 QC-passed P0s on Day 1; QC decisions on 3; check 1 stuck run that already passed QC | IPR Lead |\n| 2 | 3 QC pending, already shown to customers as Delivered | Confirm, or pull back and tell the customer | QA/QC |\n| 3 | 4 QC-passed: 3 ready, 1 with a stuck run | Release | Eng B |\n| 4 | 4 QC pending | QC decision; release the passes | QA/QC |\n| 5 | 2 processing errors | Retry once, after a frames check | Eng A |\n| 6 | 9 holds (8 BBR, 1 incomplete) | No retries; tell customers; request re-downlink | IPR Lead |\n\nAcross the rows: 5 QC-passed images ready to release, 2 QC-passed with stuck runs, and 10 waiting for a QC decision. The image-level list is the dashboard's Act now view.\n\n## Week 1: clear what customers feel (days 1–5)\n\n| Problem | Fix | Owner | Hours | Days |\n| --- | --- | --- | --- | --- |\n| Engineer skills and QC review time are unknown | Confirm owners; time the first QC reviews | IPR Lead |  | 1 |\n| 5 images passed QC but were never released (2 are P0) | Release them, P0s first | Eng B | Eng B 2.5h, QA/QC 1.25h | 1 |\n| QC is first come, first served, so P0s wait behind P4s | Sort the QC queue by deadline | QA/QC | QA/QC 1h | 1, then daily |\n| 10 images are waiting for a QC decision | Decide them in deadline order | QA/QC | QA/QC 7.5h | 1–3 |\n| 3 runs never finished | Recover or re-trigger each one | Eng A | Eng A 6h | 1–2 |\n| 2 images failed on processing errors | Retry each once, after checking all frames arrived | Eng A | Eng A 6h, QA/QC 2h | 2–3 |\n| 3 images were released without a QC pass | Warn and log any release without a QC pass | Eng B | Eng B 15h, QA/QC 1.5h | 2–5 |\n| P0/P1 wait in the same processing queue as P4 | Build a lane that moves P0/P1 ahead of lower-priority images; QC and release checks still apply | Eng A | Eng A 18h | 3–5 |\n| 24 delivered images passed with a caveat, not cleanly | Re-review them; flag any that should have failed | QA/QC | QA/QC 12h | 3–5 |\n| 45 images show customers the wrong status | Correct them, the 4 wrongly shown as Delivered first | CS |  | 1–3 |\n| Customers with late P0/P1 images or BBR holds have no update | Send each one a status and a next-update date | CS |  | as decided |\n| 6 images were never captured | Get a retake date, or close with the customer | Tasking |  | by 3 |\n| The tracker has 6 duplicate rows | Remove them | Eng B | Eng B 2h | 2 |\n\n## Week 2: stop new misses and measure (days 6–10)\n\n| Problem | Fix | Owner | Hours | Days |\n| --- | --- | --- | --- | --- |\n| The P0/P1 lane is built but not live | Switch it on; test it on the week 2 retries | Eng A | Eng A 6h | 6–7 |\n| QC time can't be measured: no QC End or release time | Log QC Start, QC End and release time | Eng B | Eng B 12h | 6–7 |\n| Stalled runs and late images go unnoticed | Alert the owning team when a run stalls or an image passes its SLA; log the escalation | Eng B | Eng B 18h | 8–10 |\n| The week 1 release check only warns | Block releases without a QC pass; a P0 override needs QA/QC sign-off | Eng B | Eng B 3h, QA/QC 1.5h | 9 |\n| BBR fails on every retry, cause unknown | QA/QC grades severity on all 8 holds; Eng A finds likely causes and estimates a fix | Eng A | Eng A 18h, QA/QC 14h | 6–10 |\n| QC verdicts rest on free-text notes | Write pass / caveat / fail criteria per bandset, with SNR and haze limits | QA/QC | QA/QC 6h | 6–8 |\n| Images that pass QC in week 2 still need releasing | Release each the day it passes | Eng B | Eng B 3.5h | ongoing |\n| Stretch: contradictions in the tracker are found only by hand | Nightly check that flags them to the owner | Eng B | Eng B 9h | only if Week 1 runs under estimate |\n\nEngineer B is booked 56h of 60 before the stretch item, so it starts only if Week 1 frees time.\n\n## Not in these two weeks\n\n- **BBR fix:** week 2 only scopes it.\n- **Completeness gate before processing:** first in week 3.\n- **Downlink and ingest delays:** sit with ground and Tasking; we raise them with data.\n- **Blocking checks at the source, and the rest of the tracker automation:** week 3 onward."}, "internal": {"title": "IPR Internal Update", "label": "Internal update", "num": "5a", "md": "## To Engineering, IPR and QA/QC\n\n**Subject:** IPR pipeline: 28 images late, plan for the next 2 weeks\n\nHi all,\n\nWhere we are, as of the 30 Jun export:\n\n- **58% of processable images were delivered on time** (52 of 89). **No P0 image met its 8h SLA** (0 of 8).\n- **28 images are late,** 19 of them by more than two weeks. 15 belong to our three Tier 1 customers (MineralsCo, AgriSense, UrbanAtlas).\n- **What's blocking them:** 5 passed QC but were never released, 10 are waiting for a QC decision, 10 failed QC (8 with bright banding, BBR), and 3 are stuck in processing.\n- **Two process gaps:** 74% of attempts were released before QC started, and there is no QC End time, so we can't tell how long review takes.\n\nWhat we're doing, in order:\n\n1. **Today:** release the 5 QC-passed images, both P0s first (Engineer B).\n2. **Days 1–3:** QC decides the 10 pending images in deadline order (QA/QC). Engineer A clears the 3 stuck runs and reprocesses the 2 processing-error failures.\n3. **BBR:** the 8 images are on hold, not retried. None of the 8 recovered on an earlier retry. Engineer A and QA scope a fix in week 2.\n4. **Week 2:** a P0/P1 lane, QC End and release-time logging, an escalation log, a gate so nothing is released before a QC pass, and a nightly check of 20 contradiction rules that alerts the owner of each break.\n\nWhat we need from you:\n\n- **Engineering:** confirm the P0/P1 lane can go into the processing queue in week 2.\n- **QA/QC:** confirm whether QC is meant to gate release, or whether some reviews happen after release by design.\n- **Everyone:** log an escalation (who, when, ticket) when you hand off a blocked image. Today 20 of the 28 late images have no record.\n\nThe daily 15-minute stand-up runs from the dashboard's Act now list. Next update: day 5, with the late-image count and the go or no-go for the release gate.\n\nThe full plan is in the IPR 2-Week Plan doc."}, "customer": {"title": "IPR Customer-Safe Update", "label": "Customer-safe update", "num": "5b", "md": "To Customer Success, for a delayed high-priority image: UrbanAtlas.\n\n**For CS (internal, don't forward):** UrbanAtlas (Tier 1) has two late P0 images over Dubai Urban, and they have already asked for an update.\n\n- **FF01\\_20260601\\_1084\\_DUBAI** (acquired 1 Jun): passed quality checks but was never released. Release is planned for today.\n- **FF02\\_20260605\\_1088\\_DUBAI** (acquired 5 Jun): first in the QC queue for a decision. If it passes, it ships the same day; if it fails, it needs reprocessing and we'll give a new date.\n\nOne message covers both. Send it once the first image is actually released. Don't share image IDs, internal step names, or a date for the second image until QC has decided.\n\n**Message to the customer:**\n\n> Subject: Update on your Dubai Urban priority images\n>\n> Hi \\[name\\],\n>\n> Thank you for your patience, and I'm sorry for the delay on your two priority images over Dubai Urban, captured on 1 and 5 June. Both missed our committed delivery time, and that isn't the standard we hold ourselves to.\n>\n> The 1 June image is now available in your account. The 5 June image is in final quality review. I'll confirm its delivery date, or let you know if it needs more processing, by \\[date and time\\].\n>\n> We've also put a priority lane in place for high-priority orders so this doesn't repeat. If either image is time-critical for a decision on your side, tell me and I'll make sure the team knows.\n>\n> Best regards, \\[CS name\\]\n\n**What the message avoids, on purpose:**\n\n- **No promised date** for the second image until QC has decided.\n- **No internal detail:** no image IDs, no QC or processing steps, nothing about other teams.\n- **A firm time for the next update,** so the customer knows when they'll hear back.\n- **One honest line on the fix,** with no blame and no detail."}, "rules": {"title": "IPR Data Cleaning Rules", "label": "Data cleaning rules", "num": "–", "md": "Rules used to build IPR\\_Cleaned\\_Data.xlsx. Raw values are never overwritten; originals are in Fixes\\_Log.\n\n## Rule 1: Same-attempt duplicates\n\nOne row per Image ID + attempt. 6 stale duplicates removed (136 → 130 attempt rows).\n\n1. Keep the most final status: Delivered/Uploaded > Passed/Done > QC pending > Reprocessing. A terminal outcome (Target missed, No data) beats an in-progress one.\n2. Tie → more timestamps filled, then the latest.\n3. Notes only confirm a pick; they never decide.\n\n| Image ID | Kept (Excel row) | Dropped | Decided by |\n| --- | --- | --- | --- |\n| FF02\\_20260607\\_1028\\_MADHY | 25 · DataHub upload complete | 27 · Reprocessing | Status rank |\n| FF01\\_20260608\\_1029\\_SAHAR | 29 · L2A Passed | 32 · Reprocessing | Status rank |\n| FF01\\_20260611\\_1067\\_PUNJA | 44 · Done | 45 · Manual QC pending | Status rank |\n| FF03\\_20260624\\_1047\\_ODISH | 104 · Done | 105 · Reprocessing | Status rank |\n| FF01\\_20260623\\_1026\\_NILED | 132 · Target missed | 137 · Manual QC pending | Terminal outcome |\n| FF03\\_20260625\\_1074\\_GUJAR | 133 · No data | 136 · No data | Tie → stale note |\n\n## Rule 2: Latest valid attempt per image\n\n130 attempt rows → 95 images. 27 images had 2–3 attempts (26 processable + 1 never captured).\n\n1. Latest = highest attempt that was actually triggered.\n2. No valid attempt → Row Status = Not captured.\n3. SLA is locked to attempt 1: priority, SLA hours, deadline. The clock starts at acquisition, which is the same on every attempt (assumed: SLA runs from acquisition, not order).\n\n   The raw per-attempt deadline is kept beside it as Attempt Deadline (raw): acquisition + this attempt's SLA hours. It differs from SLA Deadline on 24 retry rows where priority changed. Not used for metrics; it is the evidence that a retry can move the deadline.\n4. Delivered time = earliest QC-passed upload across attempts.\n5. Earlier attempts stay as history (italic grey): out of image KPIs, used for attempt metrics.\n\n| Edge case | Images | Handling |\n| --- | --- | --- |\n| Attempt number vs trigger order disagree | 2 | Keep highest attempt; in Conflicts |\n| Delivered earlier, newer attempt not uploaded | 3 | Counts as delivered; in Conflicts. Rework of the same capture, not a new order |\n| Priority changed between attempts | 21 | Use attempt 1; in Conflicts |\n| No attempt ever triggered | 3 | Not processable |\n\n### Why 89 vs 95\n\n6 of 95 images were never captured (Row Status = Not captured). They count as images but stay out of pipeline KPIs, which use the 89 latest attempts.\n\n- Not-captured images feed a capture-rate metric, never hidden.\n- Cloud didn't cause misses: 5 of 6 misses had 21–40% cloud.\n- Partial captures and partial cloud stay in; split them with Target Status and Cloud Status.\n- Future rule: a capture with >70% cloud would be not processable. No image in this data hits it.\n\n## Rule 3: Timestamps\n\nOne UTC format. Missing times are flagged, never filled. Snapshot: 2026-06-30 16:05 UTC.\n\n1. Three formats parsed; day-first confirmed against the Image ID date.\n2. Expected order: acquisition → trigger → processing end → QC start.\n\n| Check | Rows / images | Handling |\n| --- | --- | --- |\n| Mixed formats | 9 rows | Converted |\n| Triggered, no end time | 4 | Stuck; statuses say otherwise (in Conflicts) |\n| Processed, no QC start | 6 | Already passed QC: start time missing |\n| Uploaded before QC start | 55 of 74 attempts | Open question. Staging ruled out (no QC fail was uploaded) |\n| Deadline = acquisition + SLA | 92 of 92 | Consistent |\n\n## Rule 4: Labels\n\nOne value per meaning; unseen labels → \"Unmapped\", never guessed. Last Pipeline Status (raw) stays raw text: it is stale in 41 of 123 attempts.\n\n| Column | Clean values | Notes |\n| --- | --- | --- |\n| Bandset | VNIR Full, RGB, Vegetation, Water/Coastal, Red Edge | 4 spellings of Vegetation merged |\n| Cloud Status | Clear, Partial, Cloudy, Unknown | <30%, 30–70%, >70% |\n| Target Status | Captured, Partial, Not captured | Missed + NOT\\_CAPTURED merged |\n| QC Result | Pass, Fail, Pending, Reprocess required, Not applicable | Pass with note = Pass; BBR / FAIL\\_artifact = Fail. \\\nModerate BBR (2 rows) assumed Fail, to confirm with QA. \\\n\\\nBBR is a finding, not a status; severity is kept in BBR Severity (Severe / Moderate / Unspecified / None; 13 \\\n\\\nBBR attempts: 10 severe, 1 moderate, 2 unspecified). \\\n\\\nAt the source it should be recorded where QC records its result (the system behind Manual QC Status) |\n| Image Complete | Complete, Incomplete, No image | OK = Complete |\n| QC Finding | BBR, Processing error: ISOFIT crash, \\\nProcessing error: Water mask, \\\nInput error: Missing metadata, No data, \\\nCaveat: Low SNR, \\\nCaveat: Minor haze, \\\nCaveat: Artifact reduced, None | Caveat: X = passed with that note |\n| Priority | P0 8h, P1 12h, P2 16h, P3 24h, P4 48h | Ordered by SLA: High → P2, raw P2 → P3 |\n| Strip Fulfillment | Fulfilled, Partially, Not fulfilled, Unknown | fulfilled merged |\n\n### Last Pipeline Status: kept raw, treated as unreliable\n\nLast Pipeline Status (raw) keeps all 17 raw values unchanged. It is **not used for any metric, gate or status**. Where an image is comes from timestamps, QC Result and Stuck instead.\n\nRenamed from Processing Status: it is the last status any stage wrote, not a processing status. Delivery wrote 40 attempts, processing 35, QC 15 and pre-processing 7; 33 say only Done or Complete. Fix at source: each stage owns its own status, and the current stage is derived.\n\nWhy: one field mixes five stages, and it often lags behind the timestamps.\n\n| Stage the text claims | Raw values (rows) |\n| --- | --- |\n| Acquisition | No data (6), Target missed (1), Not triggered (1) |\n| Processing, in progress or stuck | Reprocessing (7), Stuck in queue (2) |\n| Processing outcome | L2A Passed (18), L2A Failed (7), Failed at L2A (2), Failed at L1C (1), ISOFIT failed (1) |\n| QC | Manual QC pending (12), Needs science review (3), QC Hold (2) |\n| Delivery | DataHub upload complete (21), Sent to Aurora (19) |\n| Unclear stage | Done (24), Complete (9) |\n\nWhere it disagrees with the other fields (valid attempts):\n\n| Status text says | But | Attempts |\n| --- | --- | --- |\n| Manual QC pending | QC Result = Pass | 10 |\n| Done / Complete / L2A Passed | QC still Pending | 8 |\n| DataHub upload complete | QC still Pending (released without a pass) | 2 |\n| L2A Passed / Complete / Sent to Aurora | No Processing End (stuck) | 3 |\n| Stuck in queue | Processing finished | 2 |\n\nThe only use left is a weak escalation hint (Needs science review, QC Hold, Reprocessing). Fix at the source: one status per stage, from a fixed list, set automatically by each system.\n\n### Failure Reason: kept raw, grouped into QC Finding\n\nFailure Reason (raw) keeps all 16 raw values (blank included) unchanged. It is **usable once grouped**: QC Finding groups it into 5 values, and that is what the metrics use. Every Fail and Reprocess required has a reason.\n\n| QC Finding | Raw values (rows) | Total |\n| --- | --- | --- |\n| Caveat: Low SNR | low SNR but accepted (19) | 19 |\n| Caveat: Minor haze | minor haze (16) | 16 |\n| Caveat: Artifact reduced | artifact reduced (5) | 5 |\n| BBR | severe BBR (4), bbr severe (4), BBR (2), Bright banding (2), Banding bright (1) | 13 |\n| Processing error: ISOFIT crash | ISOFIT crash (3) | 3 |\n| Processing error: Water mask | water mask failed (3) | 3 |\n| Input error: Missing metadata | missing metadata (2) | 2 |\n| No data | No frames (4), Target not captured (2), black frame (1) | 7 |\n| None | blank (64), Recovered after reprocess (4) | 68 |\n\nCaveats are split by type so each can be filtered (15 / 12 / 5 images). Low SNR and haze are notes only: no measured SNR or haze % is logged. Ask Engineering to log SNR per band and haze % per image; until then no SNR column.\n\nProcessing errors are split by step and owner. \\\nISOFIT crash and water mask are L2A steps (science team). \\\nMissing metadata is an input error: auxiliary files never arrived, so a rerun alone won't fix it (ground segment / ingest).\n\nWhat to watch:\n\n- **Free text, five spellings of BBR.** Grouping fixes this; severity is kept in BBR Severity. All 13 BBR rows agree with QC Result and BBR Severity except one (moderate in QC status, severe in the reason; flagged in Conflicts). BBR repeats on retry: 3 images had it on every attempt.\n- **Not all values are reasons.** \"Recovered after reprocess\" is an outcome, so it counts as a clean pass (the reprocess already shows in Attempt); on 2 rows it sits on attempt 1, flagged in Conflicts. \"Target not captured\" belongs to acquisition.\n- **8 rows are still QC Pending though the reason already reads as a verdict** (5 as a pass, 3 as a fail). These are flagged in Conflicts.\n- **Blank means no issue noted,** not a missing value: 64 rows, almost all Pass or Pending.\n\nFix at the source: pick the finding and its severity from a fixed list, with free text only as a note.\n\n## Rule 5: Numbers\n\nReal number or blank. Impossible values → blank + Conflicts. Text pairs split into two columns.\n\n| Column | Found | Handling |\n| --- | --- | --- |\n| Cloud Cover % | −4 (1 row), \"NA\" (2) | Blank + Conflicts |\n| Coverage vs Image Complete | 8 rows Complete at 42–79% (all Partial) | Conflicts; trust coverage |\n| Coverage vs Target Status | 2 Not captured at 12.4% | Conflicts |\n| Relative Light | 0.48, 0.72 among categories | Unmapped numeric; scale unknown |\n| Satellite zenith | −0.6° (1 row) | Conflicts; likely sign error |\n| Angle and offset pairs | Text pairs | Split |\n\n## Rule 6: Delivered\n\nDelivered = an attempt passed QC and was uploaded. 61 of 89; 52 on time (Hours vs Deadline ≤ 0).\n\n| Delivery Status | Images |\n| --- | --- |\n| Delivered | 61 (52 on time, 9 late) |\n| Failed | 11 |\n| QC passed, not uploaded | 7 |\n| In progress | 7 |\n| Uploaded without QC pass | 3 |\n| Not processable | 6 |\n\nCustomer status is derived, not taken from the raw column: Delivered / Delayed (late) / At risk (<25% SLA left) / On track / Not captured. At the snapshot all 28 undelivered images are Delayed; customers see only 6 as Delayed.\n\nHow the dashboard reads these:\n\n- **Late** = processable, not delivered, past the SLA deadline. Open images not yet due are not late. (At the snapshot all 28 open images are late.) At risk on the dashboard = not late yet, but the upper ETA (p80) lands after the deadline; the workbook's Customer Status (derived) uses < 25% of SLA left instead. Both give 0 at the snapshot.\n- **Passes with a caveat (Low SNR, Minor haze, Artifact reduced)** counts as Delivered but is shown apart: 24 of 61 delivered (39%), and 21 of the 52 on-time deliveries. A clean pass and a pass with a known issue are not the same success.\n- **Customer status shown wrong** (45 of 95) is ranked by risk: 4 shown Delivered when not, 2 delays hidden, 2 with the wrong delay reason, 37 understated (delivered but not shown so).\n- **Failed with BBR** is never told \"being reprocessed\": none of the 8 BBR images recovered on a retry, so the customer hears \"under quality review; we will confirm a new date\".\n- **Internal customers** (Calibration, Internal Demo: 15 of 95 images) use the same pipeline, so they stay in pipeline, QC and Engineering metrics and the Top 5, but are left out of customer views (late by customer, work complete by customer, Customer Success). Leaving them out barely moves the headline: on-time 58% → 59%, late images 28 → 23.\n\n## Missing data\n\nOnly unexplained blanks are gaps (26 of 130 attempt rows). Gaps are never filled.\n\n| Gap | Rows |\n| --- | --- |\n| Upload missing after QC pass | 13 |\n| Strip fulfillment time missing | 8 |\n| QC start missing after processing | 6 |\n| Processing end missing (stuck) | 4 |\n| Cloud % blank or invalid | 3 |\n| SNR not in export (Low SNR is only a note, 15 images) | All |\n| Haze % not in export (Minor haze is only a note, 12 images) | All |\n| Note author not in export (Notes owner unknown) | All |\n\n## Rule 7: Naming\n\n- **QC** = per-image review; **QA** = process quality (metrics only).\n- Renamed: QA Assigned → QC Start (assumed; may be a post-release QA audit), Manual QC Status → QC Result, Image Priority / Deadline → SLA Priority / Deadline, Failure Category → QC Finding.\n- \"Attempt …\" = this run; \"SLA …\" = locked attempt-1 value; \"(raw)\" = original text; all times UTC; units in the name.\n\n## Rule 8: Conflicts\n\nOne column lists every contradiction on a row; None = clean. 81 of 95 images have one, 49 have two or more. 20 types (full list in Column\\_Map), e.g. customer status vs data (45), uploaded before QC (42), priority changed (21). Four compare QC Result with the notes: QC Pending while Failure Reason already holds a verdict (8 rows: 5 read as a pass, 3 as a fail), Pass while the status text says QC pending or reprocessing (11), Pass while a note flags recurring BBR (7), and a QC decision on a run that never finished (1). One more: QC status says moderate BBR while Failure Reason says severe (1 row; recorded as Severe), and Failure Reason saying recovered after reprocess on an attempt-1 row (2).\n\n### Contradiction checks: which column can contradict which\n\nEach row is a rule that must hold between two columns, how often this export breaks it, and what an automated check should do. **Block** = reject at write time; **Warn** = allow, but flag for the owner; **Review** = a person decides.\n\n| Stage | Column A | Column B | Must hold | Broken now | Check |\n| --- | --- | --- | --- | --- | --- |\n| Order | Attempt Priority (attempt 1) | Attempt Priority (later attempts) | Priority doesn't change on a retry without an override | 21 images | Block, override with reason |\n| Order | SLA Deadline | Acquisition Time + SLA hours | Equal | 0 of 92 | Block |\n| Order | Attempt | Trigger (UTC) | A higher attempt triggers later | 2 | Block |\n| Order | Trigger (attempt n+1) | Processing End (attempt n) | The next run starts after the previous one ends | 7 | Warn |\n| Acquisition | Cloud Cover % | Cloud Status | < 30% Clear, 30–70% Partial, > 70% Cloudy | 0 | Set automatically |\n| Acquisition | Plan Coverage % | Target Status | ≥ 95% Captured, 1–94% Partial, 0% Not captured | 2 | Set automatically |\n| Acquisition | Plan Coverage % | Image Complete | Complete only with full coverage | 8 | Block |\n| Acquisition | Target Status | Strip Fulfillment | Not captured can't be Fulfilled | 5 | Block |\n| Processing | Processing End | Last Pipeline Status | No \"passed / complete / sent\" without an end; no \"stuck\" with one | 6 | Status set automatically |\n| Processing | Processing End | QC Result | A QC decision needs a finished run | 1 | Block |\n| QC | QC Result | Last Pipeline Status | A QC pass can't still read \"QC pending\" or \"Reprocessing\" | 11 | Status set automatically |\n| QC | QC Result | Failure Reason | Pending has no verdict; every Fail has a reason | 8 / 0 | Block |\n| QC | QC Result (raw) | BBR Severity | The severity in the status and in the reason agree | 1 | Block |\n| QC | Failure Reason | Attempt | \"Recovered after reprocess\" only on attempt 2+ | 2 | Block |\n| QC | QC Result | Notes | A pass with a \"recurring BBR\" note gets a second look | 7 | Review |\n| QC | QC Start | DataHub Upload | Release only after QC starts | 55 of 74 attempts | Warn, then Block |\n| Delivery | QC Result | DataHub Upload | Release only after a pass | 3 images | Block (with a P0 override) |\n| Delivery | Delivered (earlier attempt) | Later attempt | A rerun after delivery has a recorded reason, and is released or closed | 3 | Warn |\n| Delivery | Strip Fulfillment Time | DataHub Upload | Rule unclear: fulfillment comes after upload in 44 of 53 | — | Open question |\n| Customer | Customer Status (shown) | Customer Status (derived) | Equal | 45 | Shown status set from derived |\n\nSingle-column checks, for the same check job: Cloud Cover % between 0 and 100 (3 broken), Relative Light from its category list (6 numbers), Satellite zenith ≥ 0° (1).\n\nRun the checks where the data is written, not only in this sheet. The sheet flags; the source should block.\n\n## Workbook layout\n\n52 columns: 35 raw (all raw columns covered) + 17 added. Every added column is filled on every row; only raw columns can be blank. One Row Status column says which rows count (it replaced the Image Row and In Pipeline KPI flags, which it fully determined).\n\n| Tab | Holds |\n| --- | --- |\n| Cleaned\\_Data | 136 rows; row 1 = stage, row 2 = headers |\n| Column\\_Map | Each column: stage, data type, origin, affects (quality / time / both), owner, set by (auto / manual / derived), empty rows, meaning, open question (17 columns) |\n| Guide | Colour key, naming |\n| Fixes\\_Log | Original value of every changed cell (570 rows): labels, timestamps, 3 invalid Cloud % blanked (NA, NA, −4), 24 deadlines recalculated to the attempt-1 SLA, 6 blank deadlines labelled N/A |\n\n**Step timing**\n\n| Step | Start → End | Column | Target | Avg |\n| --- | --- | --- | --- | --- |\n| 1. Ingest | Acquisition → Trigger | Ingest Wait (h) | 20% | 9.1h |\n| 2. Processing | Trigger → Processing End | Processing (h) | 30% | 5.2h |\n| 3. QC wait | Processing End → QC Start | QC Wait (h) | 10% | 3.5h |\n| 4. QC review + release | QC Start → QC End (missing) | Not measurable | 25% |  |\n| End-to-end | Acquisition → Delivered | End-to-end (h) | 85% | 13.1h |\n\n**Dropped as duplicates:** Delivered, Segment, Processability, Image/Attempt SLA hours, On Time + Hours Late (→ Hours vs Deadline), Reprocessed, Attempt Count, Awaiting QC, Re-delivery In Progress, Hours Stuck, Rework Wait, Failed Stage, Pipeline Step, 5 mismatch flags (→ Conflicts), Label/Timestamp Fixes (→ Fixes\\_Log).\n\n**Tagged unreliable (kept raw, not used for metrics):** Customer Status (shown), Last Pipeline Status (raw), Notes, Strip Fulfillment and its time. Red italic header in the data tab; Column\\_Map → Unreliable = Yes. Kept because they are the evidence for the gaps they show.\n\n## Glossary\n\n| Term | Meaning |\n| --- | --- |\n| AOI | Customer's target area |\n| Attempt | One processing run; >1 = reprocess |\n| Bandset | Spectral bands delivered (RGB, VNIR Full, Vegetation, Red Edge, Water/Coastal) |\n| BBR | Bright-banding artifact; top QC failure |\n| Conflict | Two fields on a row that contradict |\n| DataHub | Upload platform; delivery after QC pass |\n| Downlink / ingest | Satellite → ground → pipeline |\n| End-to-end (delivery time) | Acquisition → first delivery |\n| Hours vs Deadline | Delivered − deadline; <0 early |\n| Row Status | Why a row is in or out. Latest attempt = processable image IPR owns (89); + Not captured = all images (95); Earlier attempt (history); Removed - stale duplicate. Replaces Image Row and In Pipeline KPI |\n| ISOFIT | Atmospheric-correction step |\n| L1C / L2A | Calibrated image / surface reflectance (delivered) |\n| Off-nadir | Tilt from straight down |\n| P0–P4 | Priority by SLA: 8 / 12 / 16 / 24 / 48h |\n| Processable | Captured and ≤ 70% cloud |\n| QC / QA | Per-image review / process quality |\n| Relative light | Light at acquisition (Very Low–High) |\n| Reprocess | Same capture run again; no reason recorded |\n| SLA | Hours from acquisition by priority |\n| Snapshot | 2026-06-30 16:05 UTC |\n| Stale duplicate | Same image + attempt, outdated status |\n| Strip | Ground imaged in one pass |\n| Stuck | Triggered, no end time |\n| Zenith / azimuth | Angle from overhead / compass direction |\n\n### Imaging terms\n\nFrames make a strip; a strip is cut into an image. Also in the workbook's Guide tab.\n\n| Term | Meaning |\n| --- | --- |\n| Frame | One sensor readout: a thin cross-track slice of ground, all bands. Smallest unit. |\n| Strip | All frames from one continuous pass, joined end to end (\\~40 km wide). |\n| Image | One Image ID = one satellite, one AOI, one date; usually one strip cut to the AOI. |\n| Flow | Acquisition (frames stored on board) → Downlink (frames sent to ground) → Ingest (frames assembled into a strip, L0) → Trigger → Processing. |\n| Image Complete | All frames of the strip arrived, decided at Downlink/Ingest. Not coverage (see Plan Coverage %). Should not change between attempts; it flips in 7 images. |\n| Ingest Wait (h) | Covers Downlink + Ingest. No separate timestamps for those steps. |\n| Completeness gate | Proposed check at Ingest, before Trigger. Complete → process; AOI frames present → process, flagged; AOI frames missing → hold, re-downlink or re-task, never rerun. Today 20 of 23 incomplete attempts were processed; 7 of 14 incomplete images failed QC vs 3 of 75 complete. |\n| Offset North / East (km) | Target offset from plan (Column\\_Map; raw Plan Offset North/East). How far the acquisition target sits from its planned position. Not ground displacement from nadir: view tilt is Off Nadir (°) and Satellite Zenith (°). |\n\n### Teams\n\nOnly the teams the brief names. No separate ops team is assumed.\n\n| Team | Role |\n| --- | --- |\n| IPR | Runs the image pipeline end to end: acquisition → processing → QC → reprocess → delivery. Led by the IPR lead. |\n| QA/QC | Per-image review: sets QC Result and QC Finding. |\n| Engineering | Owns the pipeline code and systems (stuck runs, ISOFIT, water mask). |\n| Customer Success (CS) | Talks to the customer. Sets Customer Status (shown) by hand today. |\n\nNotes have no author field, so their owner is unknown. By wording they come from IPR, QA/QC, CS and ground."}}, "nav": [{"key": "overview", "label": "Overview", "num": "0"}, {"key": "note", "label": "2-page note", "num": "1 · 2"}, {"key": "appendix", "label": "Note appendix", "num": "1"}, {"key": "plan", "label": "2-week plan", "num": "4"}, {"key": "internal", "label": "Internal update", "num": "5a"}, {"key": "customer", "label": "Customer-safe update", "num": "5b"}, {"key": "rules",
