<style>
/* Layout: a review binder. Fixed index of deliverables on the left, one document at a time on the right; a VNIR band strip marks the header. */
:root {
  --bg: #f4f6f5;
  --panel: #ffffff;
  --fg: #172126;
  --muted: #5a676d;
  --line: #d9e0de;
  --accent: #1f5f7a;
  --accent-soft: #e3eef2;
  --bad: #b23a2e;
  --warn: #9a6b12;
  --ok: #2c7a4b;
  --code-bg: #eef2f1;
  --font-display: "IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
:root[data-theme="dark"] {
  --bg: #10171a; --panel: #172024; --fg: #e3e9e8; --muted: #93a3a8; --line: #2a373c;
  --accent: #7cc0d8; --accent-soft: #1d3540; --bad: #ef8a7c; --warn: #e0b45a; --ok: #7fcc98; --code-bg: #1d282c;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.55; }
a { color: var(--accent); text-underline-offset: 2px; }
a:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }

.band { height: 6px; background: linear-gradient(90deg, #4b3aa8 0%, #2f6fd0 14%, #1f9fb0 28%, #3fa64a 42%, #c9c32a 55%, #e08a2a 68%, #c63b2b 80%, #7a1f2b 100%); }
header.top { border-bottom: 1px solid var(--line); background: var(--panel); }
.top-inner, .shell { max-width: 1240px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.top-inner { padding-block: 18px 16px; display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 24px; }
.top-inner h1 { margin: 0; font-family: var(--font-display); font-weight: 600; font-size: 1.6rem; letter-spacing: 0.01em; text-wrap: balance; }
.meta { font-family: var(--font-mono); font-size: 0.78rem; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 16px; }
.band-label { font-family: var(--font-mono); font-size: 0.7rem; color: var(--muted); letter-spacing: 0.06em; text-transform: uppercase; }

.shell { display: grid; grid-template-columns: 232px minmax(0, 1fr); gap: 32px; padding-block: 28px 64px; }
nav.index { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); align-self: start; }
nav.index .label { font-family: var(--font-mono); font-size: 0.7rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin: 0 0 10px; }
nav.index ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
nav.index a { display: grid; grid-template-columns: 2.6em 1fr; gap: 8px; align-items: baseline; padding: 7px 10px; border-radius: 6px; color: var(--fg); text-decoration: none; }
nav.index a .num { font-family: var(--font-mono); font-size: 0.74rem; color: var(--muted); font-variant-numeric: tabular-nums; }
nav.index a:hover { background: var(--accent-soft); }
nav.index a[aria-current="page"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
nav.index a[aria-current="page"] .num { color: var(--accent); }

article { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 32px clamp(18px, 4vw, 48px) 40px; min-width: 0; }
.doc-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; margin-bottom: 20px; padding-bottom: 16px; border-bottom: 1px solid var(--line); }
.doc-head .kicker { font-family: var(--font-mono); font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); }
.doc-head h2 { margin: 0; flex-basis: 100%; font-family: var(--font-display); font-weight: 600; font-size: 1.9rem; line-height: 1.15; text-wrap: balance; }


.md { min-width: 0; }
.md > p, .md > ul, .md > ol, .md > blockquote, .md > h2, .md > h3 { max-width: 72ch; }
.md h2 { font-family: var(--font-display); font-weight: 600; font-size: 1.35rem; margin: 2em 0 0.5em; text-wrap: balance; }
.md h3 { font-family: var(--font-display); font-weight: 600; font-size: 1.1rem; margin: 1.6em 0 0.4em; }
.md > :first-child { margin-top: 0; }
.md p, .md ul, .md ol { margin: 0 0 0.9em; }
.md ul, .md ol { padding-left: 1.3em; }
.md li { margin: 0.25em 0; }
.md li::marker { color: var(--muted); }
.md strong { font-weight: 600; }
.md code { font-family: var(--font-mono); font-size: 0.86em; background: var(--code-bg); padding: 0.1em 0.35em; border-radius: 4px; }
.md blockquote { margin: 0 0 1em; padding: 12px 18px; border-left: 3px solid var(--accent); background: var(--accent-soft); border-radius: 0 6px 6px 0; }
.md blockquote p:last-child { margin-bottom: 0; }
.md em { color: var(--muted); }
.tablewrap { overflow-x: auto; margin: 0 0 1.2em; border: 1px solid var(--line); border-radius: 6px; max-width: none; }
.md table { border-collapse: collapse; width: 100%; font-size: 0.88rem; font-variant-numeric: tabular-nums; }
.md th, .md td { text-align: left; vertical-align: top; padding: 8px 12px; border-bottom: 1px solid var(--line); overflow-wrap: anywhere; }
.md th { font-weight: 600; background: var(--code-bg); line-height: 1.3; }
.md tr:last-child td { border-bottom: 0; }
.md td:first-child { font-weight: 500; }
.md .wide { max-width: none; }
.tablewrap.decision-table th:first-child,
.tablewrap.decision-table td:first-child { width: 19%; min-width: 150px; }
.tablewrap.pattern-table table { table-layout: fixed; }
.tablewrap.pattern-table th:nth-child(1), .tablewrap.pattern-table td:nth-child(1) { width: 17%; min-width: 130px; }
.tablewrap.pattern-table th:nth-child(2), .tablewrap.pattern-table td:nth-child(2) { width: 43%; }
.tablewrap.pattern-table th:nth-child(3), .tablewrap.pattern-table td:nth-child(3) { width: 40%; }
.tablewrap.appendix-gap-table table,
.tablewrap.appendix-label-table table,
.tablewrap.appendix-check-table table { table-layout: fixed; }
.tablewrap.appendix-gap-table table { min-width: 820px; }
.tablewrap.appendix-gap-table th:nth-child(1), .tablewrap.appendix-gap-table td:nth-child(1) { width: 7%; }
.tablewrap.appendix-gap-table th:nth-child(2), .tablewrap.appendix-gap-table td:nth-child(2) { width: 27%; }
.tablewrap.appendix-gap-table th:nth-child(3), .tablewrap.appendix-gap-table td:nth-child(3) { width: 31%; }
.tablewrap.appendix-gap-table th:nth-child(4), .tablewrap.appendix-gap-table td:nth-child(4) { width: 35%; }
.tablewrap.appendix-label-table table { min-width: 860px; }
.tablewrap.appendix-label-table th:nth-child(1), .tablewrap.appendix-label-table td:nth-child(1) { width: 15%; }
.tablewrap.appendix-label-table th:nth-child(2), .tablewrap.appendix-label-table td:nth-child(2) { width: 34%; }
.tablewrap.appendix-label-table th:nth-child(3), .tablewrap.appendix-label-table td:nth-child(3) { width: 39%; }
.tablewrap.appendix-label-table th:nth-child(4), .tablewrap.appendix-label-table td:nth-child(4) { width: 12%; }
.tablewrap.appendix-check-table table { min-width: 900px; }
.tablewrap.appendix-check-table th:nth-child(1), .tablewrap.appendix-check-table td:nth-child(1) { width: 27%; }
.tablewrap.appendix-check-table th:nth-child(2), .tablewrap.appendix-check-table td:nth-child(2) { width: 15%; }
.tablewrap.appendix-check-table th:nth-child(3), .tablewrap.appendix-check-table td:nth-child(3) { width: 38%; }
.tablewrap.appendix-check-table th:nth-child(4), .tablewrap.appendix-check-table td:nth-child(4) { width: 20%; }

.qc-flow { display: grid; grid-template-columns: minmax(150px, 0.8fr) minmax(200px, 1fr) minmax(220px, 1.25fr); gap: 14px; margin: 0 0 1.2em; max-width: none; }
.qc-flow-stage { display: grid; gap: 8px; align-content: start; min-width: 0; }
.qc-flow-label { margin: 0; color: var(--muted); font-family: var(--font-mono); font-size: 0.7rem; letter-spacing: 0.06em; text-transform: uppercase; }
.qc-flow-node { position: relative; padding: 10px 12px; border: 1px solid var(--line); border-left: 4px solid var(--accent); border-radius: 6px; background: var(--code-bg); }
.qc-flow-stage:not(:first-child) .qc-flow-node::before { content: "←"; position: absolute; left: -20px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 0.9rem; }
.qc-flow-node strong { display: block; font-family: var(--font-display); font-size: 1.35rem; line-height: 1; }
.qc-flow-node span { display: block; font-size: 0.84rem; line-height: 1.35; }
.qc-flow-node.success { border-left-color: var(--ok); }
.qc-flow-node.warning { border-left-color: var(--warn); }
.qc-flow-node.failure { border-left-color: var(--bad); }
.qc-flow-node.pending { border-left-color: var(--accent); }
.qc-flow-note { max-width: 72ch; margin-top: -0.35em !important; color: var(--muted); font-size: 0.88rem; }
.open-backlog-flow { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin: 0 0 0.9em; max-width: none; }
.failure-breakdown { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin: 0 0 1.2em; max-width: none; }
.failure-breakdown .qc-flow-node::before { display: none; }

.detail-toggle { margin: 1.5em 0; border: 1px solid var(--line); border-radius: 6px; background: var(--code-bg); }
.detail-toggle summary { cursor: pointer; padding: 11px 14px; color: var(--accent); font-weight: 600; }
.detail-toggle summary::marker { color: var(--accent); }
.detail-toggle[open] summary { border-bottom: 1px solid var(--line); }
.detail-toggle > :not(summary) { margin-left: 14px; margin-right: 14px; }
.detail-toggle > h2 { margin-top: 1.3em; }
.detail-toggle > h3 { margin-top: 1.1em; }
.detail-toggle .tablewrap { margin-left: 14px; margin-right: 14px; width: calc(100% - 28px); }

.tablewrap:has(table th:nth-child(6)) table { font-size: 0.82rem; }
.tablewrap:has(table th:nth-child(6)) th,
.tablewrap:has(table th:nth-child(6)) td { padding: 7px 9px; }

.pager { display: flex; justify-content: space-between; gap: 12px; margin-top: 36px; padding-top: 18px; border-top: 1px solid var(--line); font-size: 0.9rem; }
.pager a { text-decoration: none; display: grid; gap: 2px; }
.pager a span { font-family: var(--font-mono); font-size: 0.72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
.pager .next { text-align: right; margin-left: auto; }

@media (max-width: 860px) {
  .shell { grid-template-columns: minmax(0, 1fr); gap: 16px; padding-block: 16px 48px; }
  nav.index { position: static; }
  nav.index ol { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; }
  nav.index a { display: flex; gap: 6px; white-space: nowrap; border: 1px solid var(--line); background: var(--panel); }
  .qc-flow { grid-template-columns: 1fr; gap: 14px; }
  .qc-flow-stage:not(:first-child) .qc-flow-node::before { content: "↑"; left: 50%; top: -15px; transform: translateX(-50%); }
  .open-backlog-flow { grid-template-columns: 1fr; }
  .failure-breakdown { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: no-preference) { article { animation: rise 0.18s ease-out; } @keyframes rise { from { transform: translateY(4px); } to { transform: none; } } }
</style>

</div>

<script type="application/json" id="data">{"docs":{"overview":{"title":"IPR PM Assignment – Submission","label":"Overview","num":"0","md":"## Deliverables\n\n| # | Deliverable | Where |\n| --- | --- | --- |\n| 1 | 2-page note: what is happening in the pipeline, plus answers to questions A–F | [IPR Pipeline Health – 2-Page Note](#note) |\n| 2 | Top 5 daily metrics, with numerator and denominator | [2-page note, \"Top 5 daily metrics\"](#note); live on the dashboard |\n| 3 | Dashboard: views for the IPR lead, QA/QC, Engineering and Customer Success, filtered by week, satellite, bandset, priority and customer | [IPR Pipeline Dashboard](IPR_Pipeline_Dashboard.html) |\n| 4 | 2-week plan for 2 engineers and 1 QA/QC person | [IPR 2-Week Plan](#plan) |\n| 5a | Internal update to Engineering, IPR and QA/QC | [IPR Internal Update](#internal) |\n| 5b | Customer-safe update to Customer Success for a delayed high-priority image (UrbanAtlas P0s) | [IPR Customer-Safe Update](#customer) |\n\n**Supporting material:**\n\n- [IPR Data Cleaning Rules](#rules): every cleaning decision, with counts.\n- [IPR Cleaned Data (Google Sheet)](https://docs.google.com/spreadsheets/d/1H5MagVDtXSokKoSzb_ETOgIPoxjnbulVaNIjAcQHKFY/edit?usp=sharing): the cleaned data, one row per image attempt, with a column guide and a log of every changed cell. Also attached as IPR\\_Cleaned\\_Data.xlsx.\n\n### From export rows to images\n\nImages acquired 1–28 Jun 2026.\n\n| Count | Number | How it's made |\n| --- | --- | --- |\n| Export rows | 136 | Rows in the source export |\n| − Duplicates removed | 6 | Stale copies of the same attempt |\n| = Valid rows | 130 | 123 processing attempts + 7 rows for not-captured images |\n| Images | 95 | One per ordered capture |\n| Processable images | 89 | Processed 123 times (one attempt per run); 26 needed more than one run |\n| Average attempts per image | 1.38 | 123 ÷ 89: 63 ran once, 18 twice, 8 three or more times |\n| Not captured | 6 | 7 rows (some tried more than once); no processing run; excluded from delivery metrics |"},"note":{"title":"IPR Pipeline Health – 2-Page Note","label":"2-page note","num":"1 · 2","md":"## Summary\n\n37 of 89 processable images were late; 11 failed. No P0 image met its SLA.\n\n| Headline | Value |\n| --- | --- |\n| On time (processable images) | 58% (52 of 89) |\n| Delivered | 69% (61 of 89) |\n| P0 on time | 0 of 8 |\n| Customer status wrong | 45 of 95 images |\n\nThe export shows five issues requiring action: P0 misses, invalid QC-to-upload sequencing, incomplete imagery entering processing, recurring BBR, and missing recorded escalation for blocked images (see Root causes).\n\n**Actions and owners:** see the [IPR 2-Week Plan](#plan).\n\n## Pipeline health\n\nAll 28 undelivered processable images are past their deadline. Seven have a QC pass but no upload; three were uploaded without a QC pass. Confirm each image’s current state before assigning an action.\n\n| Bucket | Images | Rule |\n| --- | --- | --- |\n| Not captured | 6 | Never imaged; out of KPIs. 2 (AgriSense, UrbanAtlas) are shown to customers as Delivered: correct the status, offer a re-task |\n| Cloudy, not processable | 0 | Over 70% cloud |\n| Delivered | 61 | QC pass + upload |\n| QC passed, not uploaded | 7 | 5 have QC Pass and no Stuck flag; 2 also have a Stuck flag |\n| Uploaded without QC pass | 3 | Uploaded without a QC pass—an error. All three require review; two are also incorrectly marked Delivered to customers. |\n| In progress | 7 | Processing or in QC |\n| Failed | 11 | Processing or QC failed |\n\n- **Delivered images include cloud cover up to 68%.**\n- **Open late images are 17.9 days past deadline at the median:** assign each a delivery, re-task or closure decision.\n\n## Where time is lost\n\n- Timing analysis covers 123 valid processing attempts. Step targets are proposed, not agreed operational targets.\n- No P0, P1, or P2 attempt met all three measurable timing targets.\n- QC review and upload timing cannot be measured: QC End is missing, and upload precedes QC Start in 74% of attempts.\n- Missing timestamps count as not meeting the target.\n\n| Step | Proposed target (% of SLA) | Avg actual (h) | Avg proposed target (h) | Finding |\n| --- | --- | --- | --- | --- |\n| 1. Acquisition → processing start | 20% | 9.1 | 6.1 | 51% over target |\n| 2. Processing | 30% | 5.2 | 9.2 | 31% over target |\n| 3. Waiting for QC | 10% | 3.5 | 3.1 | 59% over target |\n| 4. QC review (QC start → QC end) | 25% | Not measurable | 8.0 | QC End is not logged |\n| 5. Upload (QC end → DataHub upload) | 15% | Not measurable | 4.6 | QC End is not logged; upload precedes QC Start in 74% of attempts, so the timestamp sequence is invalid |\n| End-to-end delivery time (per delivered image) | 100% | 13.1 | 30.9 | 15% of delivered images were after deadline |\n\n| SLA priority | Attempts | Ingest: actual / target | Processing: actual / target | QC wait: actual / target | All three within target |\n| --- | --- | --- | --- | --- | --- |\n| P0 (8h) | 11 | 8.5h / 1.6h | 5.0h / 2.4h | 3.6h / 0.8h | 0 of 11 |\n| P1 (12h) | 17 | 10.2h / 2.4h | 6.1h / 3.6h | 2.6h / 1.2h | 0 of 17 |\n| P2 (16h) | 23 | 9.9h / 3.2h | 6.0h / 4.8h | 3.7h / 1.6h | 0 of 23 |\n| P3 (24h) | 15 | 7.3h / 4.8h | 4.4h / 7.2h | 4.0h / 2.4h | 2 of 15 |\n| P4 (48h) | 57 | 9.0h / 9.6h | 5.0h / 14.4h | 3.5h / 4.8h | 23 of 57 |\n\n## Root causes\n\n**P0 missed its SLA; the queue rule is not in the export**\n\n- P0 median delivery: 10.4h against an 8h SLA.\n- The export does not show the queue rule or prove first-come-first-served handling.\n\n**QC-to-upload timestamp order is invalid**\n\n- Upload precedes QC Start in 74% of attempts.\n- QC End is missing, so the records cannot show whether QC was logged late or occurred after upload.\n\n**Incomplete images were processed**\n\n- Image Complete = Incomplete means not all frames from the acquired strip arrived during downlink or ingest.\n- It does not mean the target was missed or that plan coverage was low.\n- All 19 incomplete processable attempts were triggered.\n- QC failed for 7 of 14 latest incomplete images, versus 3 of 75 complete images.\n- This identifies a risk pattern, not a proven cause.\n\n**BBR repeats after reprocessing**\n\n- BBR is the leading QC finding.\n- It repeated on retries for three images, appearing on every attempt.\n\n**Blocked images have no recorded escalation**\n\n- “Blocked” is a derived label for an image that cannot complete the workflow because an issue remains unresolved.\n- Seven images have a QC pass but no upload.\n- Twenty-five of 34 blocked images have no recorded escalation.\n- The export cannot confirm whether a process exists outside it.\n\n### Patterns behind them\n\n**How patterns were checked**\n\n- **Site and order context:** AOI, customer, priority/SLA and acquisition week, compared with on-time delivery, QC outcome and delivery state.\n- **Satellite and acquisition conditions:** Satellite, bandset, off-nadir, geometry, relative light and cloud, compared with processing time, QC outcome and reprocessing.\n- **Target and image integrity:** raw Target Status, Image Complete and Plan Coverage, compared with QC and delivery outcomes.\n- **Pipeline and QC outcomes:** processing attempt, timing, QC Result, QC Finding and Delivery Status, used to identify repeat failures, recovery and backlog.\n\n**Satellite timing by SLA**\n\n| Satellite | SLA group | Timing attempts | On time (latest) | QC failures | Stage avg (ingest / processing / QC wait) |\n| --- | --- | --- | --- | --- | --- |\n| FF01 | P0–P2 | 23 | 8 of 15 | 2 of 15 | 10.3h / 6.0h / 3.3h |\n| FF01 | P3–P4 | 27 | 15 of 18 | 1 of 18 | 10.0h / 5.4h / 3.9h |\n| FF02 | P0–P2 | 15 | 1 of 10 | 0 of 10 | 10.8h / 6.8h / 2.9h |\n| FF02 | P3–P4 | 22 | 8 of 15 | 4 of 15 | 9.4h / 4.7h / 3.6h |\n| FF03 | P0–P2 | 13 | 7 of 11 | 2 of 11 | 7.4h / 4.4h / 3.9h |\n| FF03 | P3–P4 | 23 | 13 of 20 | 1 of 20 | 6.3h / 4.5h / 3.3h |\n\n- **FF02 has the lowest on-time rate** in both SLA groups.\n- **FF03 P3–P4 ingest averages 6.3h,** versus 9.4–10.0h for FF01 and FF02.\n- **Cloud and off-nadir angle show no measured association** with the timing difference.\n\n**Acquisition-week view**\n\n| Metric | Jun 1–7 | Jun 8–14 | Jun 15–21 | Jun 22–30 |\n| --- | --- | --- | --- | --- |\n| Images | 18 | **29** | 18 | 24 |\n| Delivered on time | 13/18 (72%) | **12/29 (41%)** | 10/18 (56%) | 17/24 (71%) |\n| QC failed (BBR) | 1 (1) | **6 (5)** | 1 (1) | 2 (1) |\n| Image Complete = Incomplete | 2 | **8** | 2 | 2 |\n| QC passed, not uploaded | 1 | **5** | 1 | 0 |\n| Plan Coverage <80% | 0 | **3** | 2 | 2 |\n| Target Status = Partial | 0 | **3** | 2 | 2 |\n\n- **Jun 8–14 has the lowest on-time rate:** 12/29 (41%), with 6 QC failures and 5 QC-passed images not uploaded.\n- **BBR accounts for 5 of that week’s 6 QC failures.** In “QC failed (BBR),” the bracketed value is the BBR count.\n\n| Dimension | Data (latest processable images) | Read |\n| --- | --- | --- |\n| Satellite | FF02: 9/25 on time (36%), vs FF01 23/33 (70%) and FF03 20/31 (65%); 4 of 8 P0s | **FF02 has the lowest on-time rate** in both SLA groups; review its queue and ingest records |\n| Bandset | Vegetation: 15/33 on time (45%); 6 of 10 QC failures, including 5 of 8 BBR failures | **Start the BBR investigation** with Vegetation |\n| Relative light | Low: 7/17 on time (41%); 4 QC failures; 8 reprocessed (47%). Very Low: 2/6 on time | **No conclusion:** Low n=17; Very Low n=6 |\n| Cloud | Clear: 32/55 on time (58%); Partial: 19/33 (58%). Partial reprocessed 39% vs Clear 22% | **No on-time difference;** Partial images reprocessed more often |\n\n**Failure type and retry outcome**\n\n| Failure type | Images / attempts | Bandsets (attempts) | Latest delivery |\n| --- | --- | --- | --- |\n| BBR | 8 / 13 | Vegetation 6; VNIR Full 3; Water/Coastal 3; RGB 1 | 0 of 8 |\n| Processing error: ISOFIT crash | 2 / 2 | Vegetation 2 | 1 of 2 |\n| Processing error: Water mask | 3 / 3 | VNIR Full 3 | 2 of 3 |\n| Input error: Missing metadata | 2 / 2 | VNIR Full 2 | 1 of 2 |\n\n- **BBR appears on 13 attempts across 8 images; none is delivered in its latest status.**\n- **Weather and geometry do not explain processing time:** average processing varies only 4.5–5.7h by satellite; correlations with angle, cloud and coverage are ≤ 0.11.\n\n## Images needing attention: 7 late P0/P1\n\n**How IPR chooses what to look at first**\n\n- **Start with the 89 processable images.**\n- **Find the active late backlog:** 28 are past their deadline and not Delivered.\n- **Put P0 and P1 first:** 7 of the 28 are on the 8- or 12-hour SLA. P2–P4 remain in the backlog, but are lower urgency.\n- **Rank the seven:** P0 before P1, then highest hours overdue.\n- **Use State to decide the next action:** upload, QC decision, investigate a stuck run, or hold for an engineering fix.\n\n| # | Image | Customer | Priority | State | Overdue |\n| --- | --- | --- | --- | --- | --- |\n| 1 | FF01\\_20260601\\_1084\\_DUBAI | UrbanAtlas | P0 | Passed QC, never uploaded. Customer has asked for an update | 697h |\n| 2 | FF02\\_20260605\\_1088\\_DUBAI | UrbanAtlas | P0 | Waiting for a QC decision | 592h |\n| 3 | FF01\\_20260614\\_1040\\_GUJAR | MineralsCo | P0 | Passed QC, never uploaded | 375h |\n| 4 | FF02\\_20260610\\_1079\\_GUJAR | MineralsCo | P1 | Waiting for a QC decision | 463h |\n| 5 | FF02\\_20260613\\_1042\\_RAJAS | AgriSense | P1 | Passed QC, but the run is stuck (no processing end) | 401h |\n| 6 | FF03\\_20260624\\_1047\\_ODISH | MineralsCo | P1 | Waiting for a QC decision | 130h |\n| 7 | FF01\\_20260623\\_1063\\_BENGA | Internal Demo | P1 | Failed QC on BBR; held until the BBR fix | 167h |\n\nOrder and owners: see the [IPR 2-Week Plan](#plan).\n\n## Measure it: top 5 daily metrics\n\nHeadline: on-time delivery, 58% (P0 0%). Values cover the June export.\n\n| # | Metric | Numerator | Denominator | Current | Target |\n| --- | --- | --- | --- | --- | --- |\n| 1 | On-time delivery | Processable images delivered (QC pass + upload) by their deadline. Open late images count as misses | Processable images | 58% (52/89); P0 0/8 | ≥ 95% |\n| 2 | Late backlog | Processable images not delivered and past their deadline | A count, split by state | 28: 7 QC passed but not uploaded, 3 uploaded without QC, 7 in progress, 11 failed | 0 |\n| 3 | Slowest-10% delivery time vs SLA | 90th-percentile delivery time (acquisition to delivery) | Each image's SLA hours; delivered images only; excludes the 28 late undelivered images | 1.2× SLA (61 delivered) | ≤ 1.0× |\n| 4 | First-pass QC pass rate | Images that pass QC on attempt 1 | Attempt-1 QC decisions (pass, fail, or reprocess required) | 83% (65/78) | ≥ 90% |\n| 5 | Eventual delivery after reprocessing | Reprocessed images that end up delivered | Processable images with 2 or more attempts | 85% (22/26) | ≥ 90% |\n\nTargets are my proposal, still to be agreed with Engineering and QA/QC.\n\n## Data fixes: what's missing and how to prevent it\n\n| Theme | Gap today | Fix |\n| --- | --- | --- |\n| Observability | • No QC End<br>• Missing: order, L1C, ISOFIT, L2A and export timestamps<br>• No numeric SNR or haze | • Auto-log timestamps<br>• Store SNR per band and haze % |\n| Workflow integrity | • Upload before QC Start: 55/74<br>• Status conflicts: 41/123<br>• 3 reruns lack a reason | • QC Pass before upload<br>• Derive stage from events<br>• Require rerun reason + owner |\n| Data integrity | • 6 stale duplicates<br>• 21 priority changes<br>• 8 QC Results = Pending despite a pass/fail finding<br>• 13 QC-pass attempts lack upload time | • Unique Image ID + Attempt<br>• Priority override with reason<br>• Require QC result, finding and upload time |\n| Customer visibility | • Customer status wrong: 45/95<br>• No escalation recorded: 25/34 blocked images | • Derive customer status<br>• Require escalation time, target, owner and ticket ID |\n\n**Rules**\n\n- **Derive status from events:** set Customer Status, Cloud Status and current pipeline stage from their source events.\n- **Use controlled decision values:** require approved values for QC Finding, BBR Severity, Rerun Reason and Escalated To.\n- **Validate each handoff:** require QC Pass before upload, timestamps in order, one Image ID + Attempt record, and a reason plus owner for manual decisions.\n\n## Assumptions and questions to resolve\n\n**Counting rules used in this note**\n\n- **Image-level metrics:** 89 latest valid, processable image rows.\n- **Attempt-level timing:** 123 valid processing attempts.\n- **Priority and SLA:** locked to attempt 1; 21 images changed priority on a retry.\n- **Delivered:** QC Result = Pass and a DataHub upload. Passes with caveats remain delivered and are shown separately.\n- **Not captured:** 6 images excluded from processable-image KPIs.\n- **Cloud rule:** over 70% cloud = not processable. This is an analysis assumption; the only image above 70% was not captured, so it changes no KPI.\n- **SLA start:** acquisition time. Order time is not in the export.\n\n**Questions to resolve**\n\n- **QC timing:** 55/74 timestamped attempts show upload before QC Start. No failed QC attempt has a DataHub upload. Confirm whether QC Start is logged late or represents a post-upload audit.\n- **SLA start:** confirm whether the SLA begins at acquisition or order. If it starts at order, on-time performance is worse than shown here.\n- **Moderate BBR:** confirm whether Moderate BBR is a failure. This note counts it as Fail.\n- **QC review:** confirm the system of record for QC and add QC End. Without it, QC review and upload duration cannot be measured.\n- **Step targets:** confirm or revise the proposed SLA split: ingest 20%, processing 30%, QC wait 10%, QC review 25%, upload 15%.\n- **Reruns:** 23 of 34 reprocess events followed a QC pass; 3 occurred after delivery. Record the rerun reason.\n- **Aurora:** “Sent to Aurora” is the last raw status on 19 attempts and is counted as delivered here. Confirm whether Aurora is the delivery hand-off.\n- **Processing Queue:** five values appear in the export; 26 first attempts are labelled retry or reprocess. The field is excluded from metrics because its labels do not match the run type.\n\n## Index: the brief's questions\n\n|  | Question | Short answer | Where |\n| --- | --- | --- | --- |\n| A | Processing health | 95 images: 89 processable, 6 not captured. Of the 89: 61 delivered, 7 in progress, 11 failed, 7 passed QC but not uploaded, 3 uploaded without a QC pass | Pipeline health |\n| B | Images needing attention | 7 late P0/P1: two P0s that only need an upload, three waiting for QC, a stuck P1 that passed QC, and a BBR hold | Images needing attention |\n| C | Patterns | FF02 (36% on time) and Vegetation (6 of 10 latest QC failures, including 5 of 8 BBR failures) stand out; incomplete images fail far more; cloud and off-nadir angle show no pattern | Root causes |\n| D | Duplicates and attempts | One row per Image ID + attempt (6 stale duplicates removed); the latest valid attempt is the image's row; SLA locked to attempt 1 | Assumptions; Appendix |\n| E | What counts as delivered | QC Result Pass and uploaded; a pass with a caveat counts, shown apart. SLA assumed to run from acquisition | Assumptions; Top 5, metric 1 |\n| F | Data gaps to fix first | No QC-end time, upload before QC (74%), wrong customer status (45 of 95), no escalation log; 15 in all | Data fixes; Appendix |"},"appendix":{"title":"Appendix: method and data detail","label":"Note appendix","num":"1","md":"This appendix backs the 2-page note. It shows how I cleaned the export, which data gaps I found, and which checks would stop bad data at entry. Use it to audit any number in the note.\n\n## Terms used here\n\nThese are definitions I set for this analysis. Every table below uses them.\n\n| Term | Meaning |\n| --- | --- |\n| Attempt | One processing run of an image. A retry is a new attempt. |\n| Delivered | Uploaded **and** QC Result = Pass. An upload without a QC pass is not delivered. |\n| Processable | The image was captured, so it can be processed. Never-captured images are excluded. |\n| Late | Past the SLA deadline, whether delivered late or still open. |\n| On-time % | Images delivered by the deadline ÷ processable images whose deadline has passed. In the workbook: Delivered and Hours vs Deadline ≤ 0. |\n| Passed with caveat | QC passed the image but noted an issue: Low SNR, Minor haze or Artifact reduced. |\n| Customer status: shown vs derived | Shown is what CS tells the customer. Derived is what the pipeline data says. |\n| Snapshot | The latest timestamp in the export, used as \"now\" because the export has no timestamp of its own. |\n\n## How I cleaned the data\n\nEvery number in the note depends on these decisions. Source: IPR\\_Cleaned\\_Data.xlsx.\n\n| Decision | What I did | Why |\n| --- | --- | --- |\n| One row per image | Kept the latest valid attempt per image and removed stale duplicates. One Row Status column marks each row: Latest attempt, Not captured, Earlier attempt or Removed. Row-to-image counts: [Overview](#overview) | Each image is counted once |\n| Priority and SLA | Locked to attempt 1: P0 8h, P1 12h, P2 16h, P3 24h, P4 48h | A retry can change priority (21 images did), which would move the deadline |\n| Delivered | QC pass + upload, shown in Delivery Status | An upload without a QC pass isn't a finished delivery (3 images) |\n| Processable | 89 of 95 images; the 6 never captured are excluded | An image that was never captured can't be late in processing |\n| Conflicts | One Conflicts column with 20 types; None means clean | Shows every problem in a row in one place (81 of 95 images have at least one) |\n| Stage times | Used all 123 valid attempts across four duration fields | Retries also use pipeline time, so timing includes every valid attempt |\n| Snapshot | Used 2026-06-30 16:05 UTC as “now” | The export has no export timestamp, so this is the reference time for open-image age |\n| Labels and timestamps | Standardised each meaning to one value and each timestamp to UTC; originals in Fixes\\_Log | Consistent labels and timestamps make grouping and time calculations reliable |\n| Late | Used one past-deadline rule in every view | \"Not delivered\" would incorrectly include images that are not yet due |\n| Passed with caveat | Counted as delivered and reported separately | The image passed QC, but the caveat remains visible for follow-up |\n| Customer status | Compared the status shown to customers with the status derived from pipeline events; ranked mismatches by risk | 45 of 95 images differ, so Customer Success needs a risk-based correction order |\n| Internal customers | Included Calibration and Internal Demo in pipeline metrics; excluded them from customer views | They use capacity but need no customer update |\n| Last Pipeline Status (raw) | Renamed Processing Status; retained but excluded from metrics and gates | It records the last event, not the current stage; it lags timestamps in 41 of 123 attempts |\n| QC Finding | Mapped 15 Failure Reason spellings to a controlled list | Every Fail has a reason once variants are merged |\n| Offset North / East (km) | Treated as target offset from plan, as defined in Column\\_Map | It is not view displacement; Off Nadir (°) records view tilt |\n\n### Label changes\n\nOriginal values are retained in Fixes\\_Log.\n\n| Column | Raw variants | Cleaned values | Rows changed |\n| --- | --- | --- | --- |\n| Cloud Status | CLEAR, clear, Partial cloud, partly cloudy, Partly Cloudy, CLOUDY | Clear (<30%), Partial (30–70%), Cloudy (>70%), Unknown | 119 |\n| Bandset | VNIR\\_FULL, Standard\\_RGB, vegetation, VEG, RedEdge | VNIR Full, RGB, Vegetation, Red Edge, Water/Coastal | 110 |\n| Priority | Urgent, P0, P1, High, high, P2, Standard, blank | P0 (8h), P1 (12h), P2 (16h), P3 (24h), P4 (48h)<br>Raw High (16h) → P2; raw P2 (24h) → P3 | 108 |\n| QC Result | pass, Pass, QC Pass, Manual pass with note, QC Fail, FAIL\\_artifact, Severe / Moderate BBR, NA | Pass, Fail, Pending, Reprocess required, Not applicable | 86 |\n| Image Complete | OK, complete, Partial, Strip incomplete | Complete, Incomplete, No image | 86 |\n| Target Status | Missed, NOT\\_CAPTURED | Captured, Partial, Not captured | 9 |\n| Relative Light | 0.48, 0.72 (numbers in a text field) | Flagged as Unmapped numeric | 6 |\n\n### QC labels\n\nThe export records per-image QC, so `QA Assigned` is renamed `QC Start` and `Manual QC Status` is renamed `QC Result`. QA refers to process-level quality measures; “QA/QC” remains the team name.\n\n## Data gaps: what's missing and how to fix it\n\n81 of 95 images have at least one conflict. The biggest gap is the missing QC end time, which means review time can't be measured. The table lists 15 data gaps and the control for each.\n\n| # | Gap | Impact | Fix |\n| --- | --- | --- | --- |\n| 1 | No QC end time | QC review time can't be measured | Log QC start and end |\n| 2 | QC starts after upload in 74% of attempts | The timestamp sequence is invalid; the export cannot show whether QC occurred before upload | Require QC Result = Pass before upload and record timestamps in order |\n| 3 | Customer status is wrong for 45 of 95 images | Customers are misinformed | Derive customer status from pipeline state |\n| 4 | Missing values: 13 uploads, 8 strip times, 6 QC starts, 4 processing ends, 3 cloud % | Those rows drop out of timing | Make each field required at its handoff |\n| 5 | 6 stale duplicate rows | Images counted twice | Unique key: Image ID + attempt |\n| 6 | Priority changed on retry for 21 images | A lower retry priority can make an SLA appear met | Lock priority to attempt 1; require a reason for any override |\n| 7 | Mixed date formats, labels and stale status text | Dates, groups and stages can be wrong | Use UTC timestamps, controlled values and event-derived status |\n| 8 | No export timestamp | Open-image age uses an assumed snapshot | Stamp every export |\n| 9 | No order-created time | SLA can only be measured from acquisition | Record order-created time |\n| 10 | No L1C, ISOFIT or L2A timestamps | Cannot isolate the step causing a P0 delay | Record start and end time for each processing step |\n| 11 | No recorded escalation for 25 of 34 blocked images | Cannot show whether the right team was alerted | Record escalation time, target, owner and ticket ID |\n| 12 | QC Result is Pending in 8 rows despite a pass/fail finding | A QC decision can remain incomplete after a verdict is logged | Save QC Result and QC Finding together |\n| 13 | Three delivered images were rerun with no reason recorded | Cannot distinguish a customer request from a QC recheck | Require rerun reason and owner when a delivered image is retried |\n| 14 | SNR and haze values appear only in notes | Cannot set thresholds or track image quality | Record per-band SNR and per-image haze percentage |\n| 15 | Notes have no author or team | Notes cannot be routed to an owner | Record note author and team |\n\nCurrent handling in the cleaned workbook:\n\n| Gap | Current handling |\n| --- | --- |\n| 6 | Retains the per-attempt deadline in Attempt Deadline (raw); it differs on 24 retry rows |\n| 7 | Keeps Last Pipeline Status (raw) as evidence, but excludes it from metrics; stale in 41 of 123 attempts |\n| 12 | Of 8 Pending QC Results, Failure Reason indicates a pass in 5 and a fail in 3 |\n| 13 | Delivery is the first QC-passed upload; later uploads are re-deliveries |\n\n### Checks that stop bad data at entry\n\nThe workbook can only flag problems after the fact. These checks would stop them when the data is written. Historical timestamp violations remain visible as conflicts. The future system must block uploads unless QC Result = Pass.\n\n| Check | Where it runs | Action | Today |\n| --- | --- | --- | --- |\n| Timestamps in order: acquisition ≤ trigger ≤ processing end ≤ QC start ≤ QC end ≤ DataHub upload | Pipeline write | Reject and alert | |\n| Upload only when QC Result = Pass | DataHub upload step | Block | 3 images were uploaded without a QC pass; 55 of 74 timestamped attempts show upload before QC Start |\n| One row per Image ID + attempt | Export / database key | Reject duplicates | 6 duplicates |\n| Priority and SLA locked after attempt 1 | Order system | Allow an override only with a reason | 21 images changed priority |\n| Status values use a controlled list | Every status field | Reject unlisted values; allow Notes as optional context | — |\n| Cloud % is 0–100; angles are in valid range | Ingest | Reject and flag invalid values | — |\n| Customer status derives from pipeline events | CS tool | Set automatically; do not edit by hand | 45 of 95 shown statuses are wrong |\n| Target Status remains the raw capture outcome; never derive it from Plan Coverage | Acquisition / ingest | Record the source value; do not overwrite it from coverage | Coverage and Target Status measure different things |\n| Image Complete is based on received frames, not Plan Coverage | Ingest, before Trigger | Complete → process. AOI frames present → process, flagged. AOI frames missing → hold for re-downlink or re-task; do not rerun | 20 of 23 incomplete attempts were processed |\n| QC Result records the decision; QC Finding records the defect and severity | QC form | Require a result and finding for every Fail and every Pass with a caveat | BBR severity is currently free text |\n\nThe full column-pair rule set is in the [IPR Data Cleaning Rules](#rules).\n\n## Open questions for the team\n\n- **Strip Fulfillment:** Who sets it, and when? It follows upload in 44 of 53 rows and is marked Fulfilled for five never-captured images. Exclude it from metrics until clarified.\n- **ISOFIT crashes:** Who chooses retry versus engineering fix, and by when? Three images had an ISOFIT crash; one recovered after retry and two remain failed.\n- **Repeat uploads:** Why are images uploaded again after delivery? Fourteen images have uploads on two or more attempts, with no reason recorded.\n- **Coverage threshold:** What coverage rule should guide customer communication? Keep Target Status raw and report Plan Coverage separately until this is defined.\n- **BBR severity:** Which severity is authoritative when QC fields disagree? One row says Moderate in status and Severe in Failure Reason; the workbook records Severe.\n"},"plan":{"title":"IPR 2-Week Plan","label":"2-week plan","num":"4","md":"## Targets\n\n| Measure | Now | End of week 1 | End of week 2 |\n| --- | --- | --- | --- |\n| Late images | 28 | 14 | 12 or fewer, each with an owner and ETA |\n| Late P0/P1 images | 7 | 1 | 1 (a P1 BBR hold) |\n| P0/P1 QC priority rule | No | Set | Used daily |\n| Upload requires QC Result = Pass | No check | Check designed | Active from Day 9 |\n| Uploads before QC Start | 74% |  | 0% from Day 9 |\n| New attempts with QC Start, QC End and upload time | 0% |  | 100% from Day 7 |\n| Delivered images that passed QC with a caveat (Low SNR, haze, artifact), re-reviewed | 0 of 24 | all 24 |  |\n| Images showing customers the wrong status | 45 of 95 | 0 |  |\n\n- **Expected residual backlog at week 2:** 8 BBR holds, 1 incomplete image awaiting re-downlink or re-task, and up to 3 images whose retry still fails.\n\n## Team\n\n| Who | Owns | Hours |\n| --- | --- | --: |\n| Engineer A | Processing: stuck runs, retries and BBR investigation | 60h |\n| Engineer B | Uploads and data: uploads, QC gate, logging, alerts | 60h |\n| QA/QC | QC decisions, upload sign-off, caveat recheck, BBR review, QC criteria | 60h |\n| IPR Lead | Priorities, escalations, customer updates |  |\n\n**Plan assumptions**\n\n- **Capacity:** each engineer and QA/QC person has 60 hours over two weeks (6 productive hours/day).\n- **Demand:** no new images arrive during the two weeks.\n- **Owners:** confirm Engineer A, Engineer B and the upload owner on Day 1.\n- **Upload owner:** the export does not identify one. This plan assigns post-QC uploads to Eng B; move those hours if IPR confirms another owner.\n- **Targets and effort estimates:** all end-of-week targets and unconfirmed effort estimates are proposed planning values. Complete or revise them after the Day 6 tool review.\n\n## Week 1: clear what customers feel (days 1–5)\n\n| Problem | Fix | Owner | Hours | Days |\n| --- | --- | --- | --- | --- |\n| 5 QC-passed images not uploaded at snapshot<br>• 2 are P0<br>• Excludes 2 images with Stuck = Yes | Upload them, P0s first | Eng B | • Eng B: 2.5h<br>• QA/QC: 1.25h | 1 |\n| QC is first come, first served, so P0s wait behind P4s | Sort the QC queue by deadline | QA/QC | QA/QC 1h | 1, then daily |\n| 5 late images need a QC decision<br>• 1 more was uploaded before any QC decision | Decide the 5 in SLA order<br>• Review the uploaded image’s QC status | QA/QC | Re-estimate after the first reviews | 1–3 |\n| 3 late images have no Processing End | Verify each pipeline state<br>• Recover or re-trigger only if the run is incomplete<br>• Record rerun reason | Eng A | Eng A: 6h estimate | 1–2 |\n| 2 images have Processing error: ISOFIT crash | Inspect logs and input completeness<br>• Retry only after the failure condition is resolved | Eng A | Eng A: 6h estimate | 2–3 |\n| 3 images uploaded without a completed QC decision | QA/QC reviews the 3 current uploads | QA/QC | QA/QC: 1.5h estimate | 2–5 |\n| 24 delivered images have a QC caveat<br>• Low SNR, minor haze or artifact reduced | • Define pass / caveat / fail criteria<br>• Re-review all 24<br>• If an image should fail, stop further delivery and notify Customer Success | QA/QC | QA/QC: 12h estimate | 3–5 |\n| Customer recovery<br>• 45 customer statuses are wrong<br>• Late P0/P1 and BBR holds need updates<br>• 6 images were never captured | • Correct status, starting with the 4 shown as Delivered<br>• Send status and next-update date<br>• Coordinate re-task or closure | Customer Success + Tasking |  | 1–3 |\n\n## Week 2: improve operations tracking and investigate BBR (days 6–10)\n\n| Problem | Fix | Owner | Hours | Days |\n| --- | --- | --- | --- | --- |\n| Operations tracking tool has not been reviewed | • Check what the tool already records<br>• List the changes needed for timestamps, QC, uploads, alerts and duplicate prevention<br>• Trace the duplicate-write source and add an Image ID + Attempt guard<br>• Decide which changes are configuration and which need engineering | IPR Lead + Eng B + QA/QC | Day 6 review | 6 |\n| QC End is missing<br>• 13 QC-passed attempts have no DataHub Upload time | • Write QC Start when review begins<br>• Require QC End before saving QC Result<br>• Write DataHub Upload time automatically on upload<br>• Check QC Start ≤ QC End ≤ DataHub Upload | Eng B | Estimate after Day 6 system design | 6–7 |\n| No recorded escalation for 25 of 34 blocked images | • Alert when Trigger exists but Processing End is missing<br>• Alert when Hours vs Deadline > 0 and Delivery Status ≠ Delivered<br>• Require escalation time, target, owner and ticket ID | Eng B | Estimate after alert-design review | 8–10 |\n| Upload can occur without QC Result = Pass | Create check: allow upload only when QC Result = Pass | Eng B | Confirm after Day 6 tool review | 9 |\n| 8 images have BBR across 13 attempts<br>• 3 repeat BBR on every attempt<br>• 0 are delivered in latest status | • QA/QC validates BBR severity and pass / caveat / fail criteria for all 8<br>• Eng A compares the 13 BBR attempts with non-BBR attempts and records a cause hypothesis plus test | Eng A + QA/QC | Estimate after investigation design | 6–10 |\n| QC decisions are recorded in free-text notes | • Require QC Result, QC Finding and BBR Severity as structured fields<br>• Keep Notes for context only | QA/QC + Eng B | Estimate after form design | 6–8 |\n| A QC-passed image is not delivered until it is uploaded | Upload each QC-passed image on the day it passes | Eng B | Estimate after confirming upload owner | Daily |\n"},"internal":{"title":"IPR Internal Update","label":"Internal update","num":"5a","md":"## To Engineering, IPR and QA/QC\n\n**Subject:** IPR pipeline: current backlog and 2-week plan\n\nHi all,\n\nI’m sending this update to align on ownership for the 28-image late backlog and the decisions needed to start recovery this week.\n\n**Current state**\n\n| Measure | Now |\n| --- | ---: |\n| Processable images delivered on time | 52/89 (58%) |\n| P0 images within the 8h SLA | 0/8 |\n| Open late backlog | 28 |\n| Upload before QC Start | 55/74 attempts (74%) |\n\n**Week 1 actions**\n\n- **Eng B**\n  - Upload 5 QC-passed images not uploaded at snapshot.\n  - Upload the 2 P0 images first.\n- **QA/QC**\n  - Apply the P0/P1 QC priority rule.\n  - Decide 5 late images with no QC decision.\n  - Review 3 uploads made without a completed QC decision.\n  - Re-review 24 delivered caveat images.\n- **Eng A**\n  - Verify 3 late images with no Processing End.\n  - Investigate 2 ISOFIT crashes.\n- **IPR Lead**\n  - Confirm the upload owner on Day 1.\n  - Record escalation owner, time, target and ticket ID for blocked images.\n\n**Week 2**\n\n- Review the operations tracking tool before committing changes.\n- Add or configure the requirements for QC and upload timestamps, QC-pass upload control, structured QC fields, alerts and duplicate prevention.\n- QA/QC and Eng A investigate the 8 BBR-held images.\n\n**Detailed plan:** owners, sequencing and open assumptions are in the [IPR 2-Week Plan](#plan).\n\n**Decisions needed**\n\n- **IPR:** confirm who uploads a QC-passed image.\n- **QA/QC:** confirm whether QC is ever recorded after upload.\n- **Everyone:** use the escalation record when handing a blocked image to another team.\n\n**Next update:** Day 5 — report the late-image count, P0/P1 backlog, caveat-review result and the Day 6 tool-review scope."},"customer":{"title":"IPR Customer-Safe Update","label":"Customer-safe update","num":"5b","md":"**Internal brief for Customer Success — do not forward**\n\nUrbanAtlas has requested an update on two late P0 images over Dubai Urban.\n\n- **FF01\\_20260601\\_1084\\_DUBAI**\n  - QC Result = Pass; no upload is recorded.\n  - Eng B uploads it on Day 1.\n- **FF02\\_20260605\\_1088\\_DUBAI**\n  - QC decision is pending.\n  - QA/QC reviews it as a P0 on Day 1.\n  - If it passes, Eng B uploads it that day.\n  - If it does not pass, Customer Success confirms the next step and update time after QA/QC review.\n\n**Send rule for Customer Success**\n\n- Send this message only after the 1 June image is confirmed delivered.\n- Do not share image IDs or internal workflow terms.\n- Do not promise a delivery date for the 5 June image until QA/QC has decided.\n- Include a specific time for the next customer update.\n\n**Message to the customer:**\n\n> Subject: Update on your Dubai Urban priority images\n>\n> Hi \\[name\\],\n>\n> Thank you for your patience. I’m sorry that both priority images for Dubai Urban, captured on 1 and 5 June, missed their committed delivery times.\n>\n> The 1 June image is now available in your account. Send this sentence only after delivery is confirmed. The 5 June image is under quality review and is being handled as a priority. By \\[date and time\\], I will confirm its delivery date or explain the next step.\n>\n> If you have any questions before then, please reply to this email.\n>\n> Best regards, \\[CS name\\]"},"rules":{"title":"IPR Data Cleaning Rules","label":"Data cleaning rules","num":"–","md":"Rules used to build IPR\\_Cleaned\\_Data.xlsx. Raw values are never overwritten; originals are in Fixes\\_Log.\n\n## Rule 1: Same-attempt duplicates\n\nOne row per Image ID + attempt. 6 stale duplicates removed. Counts from export rows to images: [Overview](#overview).\n\n1. Keep the most final status: Delivered/Uploaded > Passed/Done > QC pending > Reprocessing. A terminal outcome (Target missed, No data) beats an in-progress one.\n2. Tie → more timestamps filled, then the latest.\n3. Notes only confirm a pick; they never decide. \"Duplicate row from reprocess attempt\" sits on 11 attempt-1 rows, and 10 of those images ran only once.\n\n| Image ID | Kept (Excel row) | Dropped | Decided by |\n| --- | --- | --- | --- |\n| FF02\\_20260607\\_1028\\_MADHY | 25 · DataHub upload complete | 27 · Reprocessing | Status rank |\n| FF01\\_20260608\\_1029\\_SAHAR | 29 · L2A Passed | 32 · Reprocessing | Status rank |\n| FF01\\_20260611\\_1067\\_PUNJA | 44 · Done | 45 · Manual QC pending | Status rank |\n| FF03\\_20260624\\_1047\\_ODISH | 104 · Done | 105 · Reprocessing | Status rank |\n| FF01\\_20260623\\_1026\\_NILED | 132 · Target missed | 137 · Manual QC pending | Terminal outcome |\n| FF03\\_20260625\\_1074\\_GUJAR | 133 · No data | 136 · No data | Tie → stale note |\n\n## Rule 2: Latest valid attempt per image\n\nOne row per image. 27 images had 2–3 attempts (26 processable + 1 never captured).\n\n1. Latest = highest attempt that was actually triggered.\n2. No valid attempt → Row Status = Not captured.\n3. SLA is locked to attempt 1: priority, SLA hours, deadline. The clock starts at acquisition, which is the same on every attempt (assumed: SLA runs from acquisition, not order).\n\n   The raw per-attempt deadline is kept beside it as Attempt Deadline (raw): acquisition + this attempt's SLA hours. It differs from SLA Deadline on 24 retry rows where priority changed. Not used for metrics; it is the evidence that a retry can move the deadline.\n4. Delivered time = earliest QC-passed upload across attempts.\n5. Earlier attempts stay as history (italic grey): out of image KPIs, used for attempt metrics.\n\n| Edge case | Images | Handling |\n| --- | --- | --- |\n| Attempt number vs trigger order disagree | 2 | Keep highest attempt; in Conflicts |\n| Delivered earlier, newer attempt not uploaded | 3 | Counts as delivered; in Conflicts. Rework of the same capture, not a new order |\n| Uploaded on two or more attempts | 14 | Delivered once, at the first QC-passed upload; later uploads are re-deliveries |\n| Priority changed between attempts | 21 | Use attempt 1; in Conflicts |\n| No attempt ever triggered | 3 | Not processable |\n\n### Why 89 vs 95\n\n6 of 95 images were never captured (Row Status = Not captured). They count as images but stay out of pipeline KPIs, which use the 89 latest attempts.\n\n- Not-captured images feed a capture-rate metric, never hidden.\n- Cloud didn't cause misses: 5 of 6 misses had 21–40% cloud.\n- Partial captures and partial cloud stay in; split them with Target Status and Cloud Status.\n- Future rule: a capture with >70% cloud would be not processable. No image in this data hits it.\n\n## Rule 3: Timestamps\n\nOne UTC format. Missing times are flagged, never filled. Snapshot: 2026-06-30 16:05 UTC.\n\n1. Three formats parsed; day-first confirmed against the Image ID date.\n2. Expected order: acquisition → trigger → processing end → QC start.\n\n| Check | Rows / images | Handling |\n| --- | --- | --- |\n| Mixed formats | 9 rows | Converted |\n| Triggered, no end time | 4 | Stuck; statuses say otherwise (in Conflicts) |\n| Processed, no QC start | 6 | Already passed QC: start time missing |\n| Uploaded before QC start | 55 of 74 attempts | Open question. Staging ruled out (no QC fail was uploaded) |\n| Deadline = acquisition + SLA | 92 of 92 | Consistent |\n\n## Rule 4: Labels\n\nOne value per meaning; unseen labels → \"Unmapped\", never guessed. Last Pipeline Status (raw) stays raw text: it is stale in 41 of 123 attempts.\n\n| Column | Clean values | Notes |\n| --- | --- | --- |\n| Bandset | VNIR Full, RGB, Vegetation, Water/Coastal, Red Edge | 4 spellings of Vegetation merged |\n| Cloud Status | Clear, Partial, Cloudy, Unknown | <30%, 30–70%, >70% |\n| Target Status | Captured, Partial, Not captured | Missed + NOT\\_CAPTURED merged |\n| QC Result | Pass, Fail, Pending, Reprocess required, Not applicable | Pass with note = Pass; BBR / FAIL\\_artifact = Fail. \\\nModerate BBR (2 rows) assumed Fail, to confirm with QA. \\\n\\\nBBR is a finding, not a status; severity is kept in BBR Severity (Severe / Moderate / Unspecified / None; 13 \\\n\\\nBBR attempts: 10 severe, 1 moderate, 2 unspecified). \\\n\\\nAt the source it should be recorded where QC records its result (the system behind Manual QC Status) |\n| Image Complete | Complete, Incomplete, No image | OK = Complete |\n| QC Finding | BBR, Processing error: ISOFIT crash, \\\nProcessing error: Water mask, \\\nInput error: Missing metadata, No data, \\\nCaveat: Low SNR, \\\nCaveat: Minor haze, \\\nCaveat: Artifact reduced, None | Caveat: X = passed with that note |\n| Priority | P0 8h, P1 12h, P2 16h, P3 24h, P4 48h | Ordered by SLA: High → P2, raw P2 → P3 |\n| Strip Fulfillment | Fulfilled, Partially, Not fulfilled, Unknown | fulfilled merged |\n\n### Last Pipeline Status: kept raw, treated as unreliable\n\nLast Pipeline Status (raw) keeps all 17 raw values unchanged. It is **not used for any metric, gate or status**. Where an image is comes from timestamps, QC Result and Stuck instead.\n\nRenamed from Processing Status: it is the last status any stage wrote, not a processing status. Delivery wrote 40 attempts, processing 35, QC 15 and pre-processing 7; 33 say only Done or Complete. Fix at source: each stage owns its own status, and the current stage is derived.\n\nWhy: one field mixes five stages, and it often lags behind the timestamps.\n\n| Stage the text claims | Raw values (rows) |\n| --- | --- |\n| Acquisition | No data (6), Target missed (1), Not triggered (1) |\n| Processing, in progress or stuck | Reprocessing (7), Stuck in queue (2) |\n| Processing outcome | L2A Passed (18), L2A Failed (7), Failed at L2A (2), Failed at L1C (1), ISOFIT failed (1) |\n| QC | Manual QC pending (12), Needs science review (3), QC Hold (2) |\n| Delivery | DataHub upload complete (21), Sent to Aurora (19) |\n| Unclear stage | Done (24), Complete (9) |\n\nWhere it disagrees with the other fields (valid attempts):\n\n| Status text says | But | Attempts |\n| --- | --- | --- |\n| Manual QC pending | QC Result = Pass | 10 |\n| Done / Complete / L2A Passed | QC still Pending | 8 |\n| DataHub upload complete | QC still Pending (uploaded without a pass) | 2 |\n| L2A Passed / Complete / Sent to Aurora | No Processing End (stuck) | 3 |\n| Stuck in queue | Processing finished | 2 |\n\nThe only use left is a weak escalation hint (Needs science review, QC Hold, Reprocessing). Fix at the source: one status per stage, from a fixed list, set automatically by each system.\n\n### Failure Reason: kept raw, grouped into QC Finding\n\nFailure Reason (raw) keeps all 16 raw values (blank included) unchanged. It is **usable once grouped**: QC Finding groups it into 5 values, and that is what the metrics use. Every Fail and Reprocess required has a reason.\n\n| QC Finding | Raw values (rows) | Total |\n| --- | --- | --- |\n| Caveat: Low SNR | low SNR but accepted (19) | 19 |\n| Caveat: Minor haze | minor haze (16) | 16 |\n| Caveat: Artifact reduced | artifact reduced (5) | 5 |\n| BBR | severe BBR (4), bbr severe (4), BBR (2), Bright banding (2), Banding bright (1) | 13 |\n| Processing error: ISOFIT crash | ISOFIT crash (3) | 3 |\n| Processing error: Water mask | water mask failed (3) | 3 |\n| Input error: Missing metadata | missing metadata (2) | 2 |\n| No data | No frames (4), Target not captured (2), black frame (1) | 7 |\n| None | blank (64), Recovered after reprocess (4) | 68 |\n\nCaveats are split by type so each can be filtered (15 / 12 / 5 images). Low SNR and haze are notes only: no measured SNR or haze % is logged. Ask Engineering to log SNR per band and haze % per image; until then no SNR column.\n\nProcessing errors are split by step and owner. \\\nISOFIT crash and water mask are L2A steps (science team). \\\nMissing metadata is an input error: auxiliary files never arrived, so a rerun alone won't fix it (ground segment / ingest).\n\nWhat to watch:\n\n- **Free text, five spellings of BBR.** Grouping fixes this; severity is kept in BBR Severity. All 13 BBR rows agree with QC Result and BBR Severity except one (moderate in QC status, severe in the reason; flagged in Conflicts). BBR repeats on retry: 3 images had it on every attempt.\n- **Not all values are reasons.** \"Recovered after reprocess\" is an outcome, so it counts as a clean pass (the reprocess already shows in Attempt); on 2 rows it sits on attempt 1, flagged in Conflicts. \"Target not captured\" belongs to acquisition.\n- **8 rows are still QC Pending though the reason already reads as a verdict** (5 as a pass, 3 as a fail). These are flagged in Conflicts.\n- **Blank means no issue noted,** not a missing value: 64 rows, almost all Pass or Pending.\n\nFix at the source: pick the finding and its severity from a fixed list, with free text only as a note.\n\n## Rule 5: Numbers\n\nReal number or blank. Impossible values → blank + Conflicts. Text pairs split into two columns.\n\n| Column | Found | Handling |\n| --- | --- | --- |\n| Cloud Cover % | −4 (1 row), \"NA\" (2) | Blank + Conflicts |\n| Coverage vs Image Complete | 8 rows Complete at 42–79% (all Partial) | Conflicts; trust coverage |\n| Coverage vs Target Status | 2 Not captured at 12.4% | Conflicts |\n| Relative Light | 0.48, 0.72 among categories | Unmapped numeric; scale unknown |\n| Satellite zenith | −0.6° (1 row) | Conflicts; likely sign error |\n| Angle and offset pairs | Text pairs | Split |\n\n## Rule 6: Delivered\n\nDelivered = an attempt passed QC and was uploaded. 61 of 89; 52 on time (Hours vs Deadline ≤ 0).\n\n| Delivery Status | Images |\n| --- | --- |\n| Delivered | 61 (52 on time, 9 late) |\n| Failed | 11 |\n| QC passed, not uploaded | 7 |\n| In progress | 7 |\n| Uploaded without QC pass | 3 |\n| Not processable | 6 |\n\nCustomer status is derived, not taken from the raw column: Delivered / Delayed (late) / At risk (<25% SLA left) / On track / Not captured. At the snapshot all 28 undelivered images are Delayed; customers see only 6 as Delayed.\n\nHow the dashboard reads these:\n\n- **Late** = processable, not delivered, past the SLA deadline. Open images not yet due are not late. (At the snapshot all 28 open images are late.) At risk on the dashboard = not late yet, but the upper ETA (p80) lands after the deadline; the workbook's Customer Status (derived) uses < 25% of SLA left instead. Both give 0 at the snapshot.\n- **Passes with a caveat (Low SNR, Minor haze, Artifact reduced)** counts as Delivered but is shown apart: 24 of 61 delivered (39%), and 21 of the 52 on-time deliveries. A clean pass and a pass with a known issue are not the same success.\n- **Customer status shown wrong** (45 of 95) is ranked by risk: 4 shown Delivered when not, 2 delays hidden, 2 with the wrong delay reason, 37 understated (delivered but not shown so).\n- **Failed with BBR** is never told \"being reprocessed\": none of the 8 BBR images recovered on a retry, so the customer hears \"under quality review; we will confirm a new date\".\n- **Internal customers** (Calibration, Internal Demo: 15 of 95 images) use the same pipeline, so they stay in pipeline, QC and Engineering metrics and the Top 5, but are left out of customer views (late by customer, work complete by customer, Customer Success). Leaving them out barely moves the headline: on-time 58% → 59%, late images 28 → 23.\n\n## Missing data\n\nOnly unexplained blanks are gaps (26 of 130 attempt rows). Gaps are never filled.\n\n| Gap | Rows |\n| --- | --- |\n| Upload missing after QC pass | 13 |\n| Strip fulfillment time missing | 8 |\n| QC start missing after processing | 6 |\n| Processing end missing (stuck) | 4 |\n| Cloud % blank or invalid | 3 |\n| SNR not in export (Low SNR is only a note, 15 images) | All |\n| Haze % not in export (Minor haze is only a note, 12 images) | All |\n| Note author not in export (Notes owner unknown) | All |\n\n## Rule 7: Naming\n\n- **QC** = per-image review; **QA** = process quality (metrics only).\n- Renamed: QA Assigned → QC Start (assumed; may be a post-upload QA audit), Manual QC Status → QC Result, Image Priority / Deadline → SLA Priority / Deadline, Failure Category → QC Finding.\n- **Upload** = sent to DataHub (DataHub Upload); **Delivered** = passed QC and uploaded. \"Release\" is not used. Column_Map wording for QC Start and DataHub Upload updated to match.\n- \"Attempt …\" = this run; \"SLA …\" = locked attempt-1 value; \"(raw)\" = original text; all times UTC; units in the name.\n\n## Rule 8: Conflicts\n\nOne column lists every contradiction on a row; None = clean. 81 of 95 images have one, 49 have two or more. 20 types (full list in Column\\_Map), e.g. customer status vs data (45), uploaded before QC (42), priority changed (21). Four compare QC Result with the notes: QC Pending while Failure Reason already holds a verdict (8 rows: 5 read as a pass, 3 as a fail), Pass while the status text says QC pending or reprocessing (11), Pass while a note flags recurring BBR (7), and a QC decision on a run that never finished (1). One more: QC status says moderate BBR while Failure Reason says severe (1 row; recorded as Severe), and Failure Reason saying recovered after reprocess on an attempt-1 row (2).\n\n### Contradiction checks: which column can contradict which\n\nEach row is a rule that must hold between two columns, how often this export breaks it, and what an automated check should do. **Block** = reject at write time; **Warn** = allow, but flag for the owner; **Review** = a person decides.\n\n| Stage | Column A | Column B | Must hold | Broken now | Check |\n| --- | --- | --- | --- | --- | --- |\n| Order | Attempt Priority (attempt 1) | Attempt Priority (later attempts) | Priority doesn't change on a retry without an override | 21 images | Block, override with reason |\n| Order | SLA Deadline | Acquisition Time + SLA hours | Equal | 0 of 92 | Block |\n| Order | Attempt | Trigger (UTC) | A higher attempt triggers later | 2 | Block |\n| Order | Trigger (attempt n+1) | Processing End (attempt n) | The next run starts after the previous one ends | 7 | Warn |\n| Acquisition | Cloud Cover % | Cloud Status | < 30% Clear, 30–70% Partial, > 70% Cloudy | 0 | Set automatically |\n| Acquisition | Plan Coverage % | Target Status | ≥ 95% Captured, 1–94% Partial, 0% Not captured | 2 | Set automatically |\n| Acquisition | Plan Coverage % | Image Complete | Complete only with full coverage | 8 | Block |\n| Acquisition | Target Status | Strip Fulfillment | Not captured can't be Fulfilled | 5 | Block |\n| Processing | Processing End | Last Pipeline Status | No \"passed / complete / sent\" without an end; no \"stuck\" with one | 6 | Status set automatically |\n| Processing | Processing End | QC Result | A QC decision needs a finished run | 1 | Block |\n| QC | QC Result | Last Pipeline Status | A QC pass can't still read \"QC pending\" or \"Reprocessing\" | 11 | Status set automatically |\n| QC | QC Result | Failure Reason | Pending has no verdict; every Fail has a reason | 8 / 0 | Block |\n| QC | QC Result (raw) | BBR Severity | The severity in the status and in the reason agree | 1 | Block |\n| QC | Failure Reason | Attempt | \"Recovered after reprocess\" only on attempt 2+ | 2 | Block |\n| QC | QC Result | Notes | A pass with a \"recurring BBR\" note gets a second look | 7 | Review |\n| QC | QC Start | DataHub Upload | Upload only after QC starts | 55 of 74 attempts | Warn, then Block |\n| Delivery | QC Result | DataHub Upload | Upload only after a pass | 3 images | Block (with a P0 override) |\n| Delivery | Delivered (earlier attempt) | Later attempt | A rerun after delivery has a recorded reason, and is uploaded or closed | 3 | Warn |\n| Delivery | Strip Fulfillment Time | DataHub Upload | Rule unclear: fulfillment comes after upload in 44 of 53 | — | Open question |\n| Customer | Customer Status (shown) | Customer Status (derived) | Equal | 45 | Shown status set from derived |\n\nSingle-column checks, for the same check job: Cloud Cover % between 0 and 100 (3 broken), Relative Light from its category list (6 numbers), Satellite zenith ≥ 0° (1).\n\nRun the checks where the data is written, not only in this sheet. The sheet flags; the source should block.\n\n## Workbook layout\n\n52 columns: 35 raw (all raw columns covered) + 17 added. Every added column is filled on every row; only raw columns can be blank. One Row Status column says which rows count (it replaced the Image Row and In Pipeline KPI flags, which it fully determined).\n\n| Tab | Holds |\n| --- | --- |\n| Cleaned\\_Data | 136 rows; row 1 = stage, row 2 = headers |\n| Column\\_Map | Each column: stage, data type, origin, affects (quality / time / both), owner, set by (auto / manual / derived), empty rows, meaning, open question (17 columns) |\n| Guide | Colour key, naming |\n| Fixes\\_Log | Original value of every changed cell (570 rows): labels, timestamps, 3 invalid Cloud % blanked (NA, NA, −4), 24 deadlines recalculated to the attempt-1 SLA, 6 blank deadlines labelled N/A |\n\n**Step timing**\n\n| Step | Start → End | Column | Target | Avg |\n| --- | --- | --- | --- | --- |\n| 1. Ingest | Acquisition → Trigger | Ingest Wait (h) | 20% | 9.1h |\n| 2. Processing | Trigger → Processing End | Processing (h) | 30% | 5.2h |\n| 3. QC wait | Processing End → QC Start | QC Wait (h) | 10% | 3.5h |\n| 4. QC review + upload | QC Start → QC End (missing) | Not measurable | 25% |  |\n| End-to-end | Acquisition → Delivered | End-to-end (h) | 85% | 13.1h |\n\n**Dropped as duplicates:** Delivered, Segment, Processability, Image/Attempt SLA hours, On Time + Hours Late (→ Hours vs Deadline), Reprocessed, Attempt Count, Awaiting QC, Re-delivery In Progress, Hours Stuck, Rework Wait, Failed Stage, Pipeline Step, 5 mismatch flags (→ Conflicts), Label/Timestamp Fixes (→ Fixes\\_Log).\n\n**Tagged unreliable (kept raw, not used for metrics):** Customer Status (shown), Last Pipeline Status (raw), Notes, Strip Fulfillment and its time. Red italic header in the data tab; Column\\_Map → Unreliable = Yes. Kept because they are the evidence for the gaps they show.\n\n## Glossary\n\n| Term | Meaning |\n| --- | --- |\n| AOI | Customer's target area |\n| Attempt | One processing run; >1 = reprocess |\n| Bandset | Spectral bands delivered (RGB, VNIR Full, Vegetation, Red Edge, Water/Coastal) |\n| Aurora | Assumed: where \"Sent to Aurora\" delivers the image; counted as delivered (open question) |\n| BBR | Bright-banding artifact; top QC failure |\n| Conflict | Two fields on a row that contradict |\n| DataHub | Upload platform; delivery after QC pass |\n| Downlink / ingest | Satellite → ground → pipeline |\n| End-to-end (delivery time) | Acquisition → first delivery |\n| Hours vs Deadline | Delivered − deadline; <0 early |\n| Row Status | Why a row is in or out. Latest attempt = processable image IPR owns (89); + Not captured = all images (95); Earlier attempt (history); Removed - stale duplicate. Replaces Image Row and In Pipeline KPI |\n| ISOFIT | Atmospheric-correction step |\n| L1C / L2A | Calibrated image / surface reflectance (delivered) |\n| Off-nadir | Tilt from straight down |\n| P0–P4 | Priority by SLA: 8 / 12 / 16 / 24 / 48h |\n| Processable | Captured and ≤ 70% cloud |\n| QC / QA | Per-image review / process quality |\n| Relative light | Light at acquisition (Very Low–High) |\n| Reprocess | Same capture run again; no reason recorded |\n| SLA | Hours from acquisition by priority |\n| Snapshot | 2026-06-30 16:05 UTC |\n| Stale duplicate | Same image + attempt, outdated status |\n| Strip | Ground imaged in one pass |\n| Stuck | Triggered, no end time |\n| Zenith / azimuth | Angle from overhead / compass direction |\n\n### Imaging terms\n\nFrames make a strip; a strip is cut into an image. Also in the workbook's Guide tab.\n\n| Term | Meaning |\n| --- | --- |\n| Frame | One sensor readout: a thin cross-track slice of ground, all bands. Smallest unit. |\n| Strip | All frames from one continuous pass, joined end to end (\\~40 km wide). |\n| Image | One Image ID = one satellite, one AOI, one date; usually one strip cut to the AOI. |\n| Flow | Acquisition (frames stored on
